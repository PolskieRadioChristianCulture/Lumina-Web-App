    <style>
      /* FLOATING BACK TO TOP BUTTON (jak na stronie głównej polskieradio.cc) */
      .back-to-top {
          position: fixed;
          right: 1.5rem;
          bottom: 2rem;
          width: 40px;
          height: 40px;
          border-radius: 50%;
          background: rgba(15, 15, 15, 0.85);
          border: 1.5px solid #D4A94A;
          color: #D4A94A;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 0.95rem;
          cursor: pointer;
          z-index: 998;
          opacity: 0;
          visibility: hidden;
          transform: translateY(15px);
          transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                      visibility 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                      transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                      background 0.2s ease,
                      color 0.2s ease,
                      box-shadow 0.2s ease;
          box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), 0 0 10px rgba(212, 169, 74, 0.15);
          backdrop-filter: blur(5px);
          -webkit-backdrop-filter: blur(5px);
          outline: none;
          user-select: none;
          -webkit-tap-highlight-color: transparent;
      }

      .back-to-top.visible {
          opacity: 1;
          visibility: visible;
          transform: translateY(0);
      }

      .back-to-top:hover {
          background: #D4A94A;
          color: #050505;
          box-shadow: 0 8px 25px rgba(212, 169, 74, 0.4);
          transform: translateY(-3px);
      }

      .back-to-top:active {
          transform: translateY(0) scale(0.95);
      }

      @media (max-width: 767px) {
          .back-to-top {
              right: 1.25rem;
              bottom: max(1.25rem, env(safe-area-inset-bottom, 20px));
              width: 44px;
              height: 44px;
              font-size: 1.05rem;
          }
      }

      /* Estetyczny scrollbar spójny z systemem CC */
      html {
        scroll-behavior: smooth;
        overflow-y: scroll !important;
      }
      body {
        overflow-y: visible !important;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f4;
      }
      ::-webkit-scrollbar-thumb {
        background: #c1c1c8;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #bb142e;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none !important;
      }
      .no-scrollbar {
        -ms-overflow-style: none !important;
        scrollbar-width: none !important;
      }

      /* PŁYNNY TICKER BROADCAST MARQUEE */
      @keyframes ccnBroadcastTicker {
        0% { transform: translate3d(0, 0, 0); }
        100% { transform: translate3d(-50%, 0, 0); }
      }
      .ccn-ticker-track {
        display: inline-flex !important;
        white-space: nowrap !important;
        width: max-content !important;
        will-change: transform;
        animation: ccnBroadcastTicker 40s linear infinite !important;
      }
      .ccn-ticker-track:hover {
        animation-play-state: paused !important;
      }
    </style>

  <body class="bg-gray-50 text-gray-900 antialiased selection:bg-[#bb142e] selection:text-white">
    <div id="root"><div id="news-startup" role="status" style="max-width:34rem;margin:4rem auto;padding:1.5rem;font:16px/1.6 system-ui;color:#18181b;background:#fff"><h1 style="color:#bb142e">CCN News</h1><p id="news-startup-message">Ładowanie wiadomości…</p><p><button onclick="location.reload()" style="padding:12px 18px;cursor:pointer">Odśwież stronę</button> <a href="https://polskieradio.cc">Przejdź do radia</a></p><noscript>Włącz JavaScript w przeglądarce, aby wyświetlić portal.</noscript></div></div>

    <!-- BACK TO TOP BUTTON (jak na stronie głównej polskieradio.cc) -->
    <button class="back-to-top" id="backToTopBtn" aria-label="Przewiń do góry" title="Przewiń do góry">
        <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
    </button>

    <script>
      setTimeout(function () {
        var message = document.getElementById('news-startup-message');
        if (message) message.textContent = 'Nie udało się uruchomić wiadomości. Odśwież stronę. Jeśli problem się powtarza, napisz: polskiercctv@gmail.com.';
      }, 15000);

      // FLOATING BACK TO TOP BUTTON LOGIC
      (function() {
        var backToTopBtn = document.getElementById('backToTopBtn');
        if (!backToTopBtn) return;

        function updateScroll() {
          if (window.scrollY > 300) {
            backToTopBtn.classList.add('visible');
          } else {
            backToTopBtn.classList.remove('visible');
          }
        }

        window.addEventListener('scroll', updateScroll, { passive: true });

        backToTopBtn.addEventListener('click', function(e) {
          e.preventDefault();
          window.scrollTo({
            top: 0,
            behavior: 'smooth'
          });
        });

        // Sprawdź początkową pozycję po załadowaniu
        updateScroll();
      })();
    </script>
