                verseUrl: "/mojabiblia?book=2CO&ch=5&mode=reader",
                audioTitle: "Nowe Stworzenie • Muzyka Uwielbienia",
                description: "„Jeśli więc ktoś jest w Chrystusie, nowym jest stworzeniem. To, co dawne, minęło, oto wszystko stało się nowe!” 📖🌿",
                amenCount: 421,
                sharesCount: 115
            },
            {
                id: "short_slowo_zycia_jan",
                title: "Na początku było Słowo, a Słowo było u Boga! 📖✨",
                author: "Cezary Rogowski",
                authorSlug: "cezaryrgowski",
                authorAvatar: "avatar_cezary_official.jpg",
                authorBadge: "Założyciel CC ✨",
                videoType: "youtube",
                videoSrc: "tGmHYArka0k",
                poster: "tlo_profilowe_cezary.jpg",
                verseRef: "Ew. Jana 1, 1-5",
                verseBook: "JHN",
                verseChapter: 1,
                verseUrl: "/mojabiblia?book=JHN&ch=1&mode=reader",
                audioTitle: "Święte Słowo • Biblia Audio CC",
                description: "„A światłość świeci w ciemności, a ciemność jej nie ogarnęła.” Poznaj głębię oryginalnego tekstu greckiego w MojejBiblii. 💡🕊️",
                amenCount: 567,
                sharesCount: 178
            }
        ];

        let shortsData = [];
        let isGlobalMuted = true;
        let activeSlideIndex = 0;
        let observer = null;

        // ── Toast Helper ──
        function showShortsToast(msg) {
            const toast = document.getElementById('shortsToast');
            if (!toast) return;
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2600);
        }

        // ── Global Mute / Unmute ──
        window.toggleGlobalMute = function() {
            isGlobalMuted = !isGlobalMuted;
            const icon = document.getElementById('globalMuteIcon');
            if (icon) {
                icon.className = isGlobalMuted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
                icon.style.color = isGlobalMuted ? '#fff' : '#facc15';
            }

            // Apply to all HTML5 video elements
            document.querySelectorAll('.short-slide video').forEach(v => {
                v.muted = isGlobalMuted;
            });

            showShortsToast(isGlobalMuted ? '🔇 Wyciszono dźwięk' : '🔊 Dźwięk włączony');
        };

        // ── Amen Reaction ──
        window.toggleAmen = function(shortId, btnEl, labelId) {
            const isLiked = localStorage.getItem('lumina_amen_' + shortId) === '1';
            const labelEl = document.getElementById(labelId);
            let count = parseInt(labelEl.getAttribute('data-count') || '0', 10);

            if (!isLiked) {
                localStorage.setItem('lumina_amen_' + shortId, '1');
                count += 1;
                btnEl.classList.add('amen-active');
                showShortsToast('🕊️ Amen! Chwała Bogu!');
            } else {
                localStorage.removeItem('lumina_amen_' + shortId);
                count = Math.max(0, count - 1);
                btnEl.classList.remove('amen-active');
            }

            labelEl.setAttribute('data-count', count);
            labelEl.textContent = count;
        };

        // ── Share WhatsApp / System ──
        window.shareShort = function(shortId, title, verse) {
            const shareUrl = `https://polskieradio.cc/rolki#${shortId}`;
            const text = `🕊️ Zobacz tę inspirującą rolkę w portalu LUMINA: „${title}” (${verse}) ➡️ ${shareUrl}`;

            if (navigator.share) {
                navigator.share({
                    title: title,
                    text: text,
                    url: shareUrl
                }).catch(() => {});
            } else {
                const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
                window.open(waUrl, '_blank');
            }
            showShortsToast('📲 Udostępnij rolkę braciom i siostrom!');
        };

        // ── Tap to Play/Pause ──
        window.handleSlideTap = function(slideEl) {
            const video = slideEl.querySelector('video');
            const indicator = slideEl.querySelector('.play-indicator-overlay');
            if (!video) return;

            if (video.paused) {
                video.play();
                if (indicator) {
                    indicator.innerHTML = '<i class="fa-solid fa-play"></i>';
                    indicator.classList.add('show');
                    setTimeout(() => indicator.classList.remove('show'), 500);
                }
            } else {
                video.pause();
                if (indicator) {
                    indicator.innerHTML = '<i class="fa-solid fa-pause"></i>';
                    indicator.classList.add('show');
                    setTimeout(() => indicator.classList.remove('show'), 500);
                }
            }
        };

        // ── Render Slides ──
        function renderSlides(items) {
            const container = document.getElementById('shortsContainer');
            if (!container) return;
            container.innerHTML = '';

            items.forEach((item, index) => {
                const isAmen = localStorage.getItem('lumina_amen_' + item.id) === '1';
                const amenDisplay = isAmen ? item.amenCount + 1 : item.amenCount;

                const slide = document.createElement('div');
                slide.className = 'short-slide';
                slide.id = item.id;
                slide.setAttribute('data-index', index);

                let mediaHtml = '';
                if (item.videoType === 'mp4') {
                    mediaHtml = `
                        <video playsinline loop preload="metadata" muted poster="${item.poster}">
                            <source src="${item.videoSrc}" type="video/mp4">
                        </video>
                    `;
                } else if (item.videoType === 'youtube') {
                    mediaHtml = `
                        <iframe src="https://www.youtube.com/embed/${item.videoSrc}?autoplay=0&mute=1&controls=0&playsinline=1&loop=1&playlist=${item.videoSrc}&rel=0&modestbranding=1" 
                                title="${item.title}" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                                allowfullscreen>
                        </iframe>
                    `;
                }

                slide.innerHTML = `
                    <div class="video-container">
                        ${mediaHtml}
                    </div>

                    <div class="tap-detector" onclick="handleSlideTap(this.closest('.short-slide'))"></div>
                    <div class="play-indicator-overlay"><i class="fa-solid fa-play"></i></div>
                    <div class="slide-gradient-overlay"></div>

                    <!-- Right Action Sidebar -->
                    <div class="action-sidebar">
                        <!-- Author Avatar -->
                        <div class="avatar-action-wrapper" onclick="window.location.href='/lumina/${item.authorSlug}'" title="Otwórz profil: ${item.author}">
                            <img src="${item.authorAvatar}" alt="${item.author}" class="avatar-circle-img" onerror="this.src='avatar_cezary_official.jpg'">
                            <div class="avatar-plus-icon"><i class="fa-solid fa-plus"></i></div>
                        </div>

                        <!-- Amen Button -->
                        <div class="action-btn-wrapper">
                            <button type="button" 
                                    class="action-circle-btn ${isAmen ? 'amen-active' : ''}" 
                                    onclick="toggleAmen('${item.id}', this, 'amenCount_${item.id}')" 
                                    title="Powiedz Amen! (Polubienie)"
                                    aria-label="Amen">
                                <i class="fa-solid fa-hands-praying"></i>
                            </button>
                            <span class="action-label" id="amenCount_${item.id}" data-count="${amenDisplay}">${amenDisplay}</span>
                        </div>

                        <!-- WhatsApp Share -->
                        <div class="action-btn-wrapper">
                            <button type="button" 
                                    class="action-circle-btn whatsapp-btn" 
                                    onclick="shareShort('${item.id}', '${item.title.replace(/'/g, "\\'")}', '${item.verseRef}')" 
                                    title="Udostępnij na WhatsApp"
                                    aria-label="Udostępnij">
                                <i class="fa-brands fa-whatsapp"></i>
                            </button>
                            <span class="action-label">${item.sharesCount}</span>
                        </div>

                        <!-- Read Bible Verse -->
                        <div class="action-btn-wrapper">
                            <a href="${item.verseUrl}" 
                               class="action-circle-btn bible-btn" 
                               title="Przeczytaj werset w MojejBiblii"
                               aria-label="Pismo Święte">
                                <i class="fa-solid fa-book-bible"></i>
                            </a>
                            <span class="action-label">Biblia</span>
                        </div>
                    </div>

                    <!-- Bottom Info Overlay -->
                    <div class="slide-info-box">
                        <div class="author-tag-row">
                            <a href="/lumina/${item.authorSlug}" class="author-name">
                                <span>@${item.author}</span>
                                <i class="fa-solid fa-circle-check" style="color:var(--gold); font-size:0.85rem;"></i>
                            </a>
                            <span class="author-badge">${item.authorBadge || 'Społeczność'}</span>
                        </div>

                        <div class="short-title-text" title="${item.title}">${item.title}</div>

                        <a href="${item.verseUrl}" class="verse-pill-btn" title="Kliknij, aby otworzyć rozdział w MojejBiblii">
                            <i class="fa-solid fa-bookmark"></i>
                            <span>${item.verseRef}</span>
                            <i class="fa-solid fa-arrow-right" style="font-size:0.65rem;"></i>
                        </a>

                        <div class="sound-ticker-row">
                            <i class="fa-solid fa-music"></i>
                            <div class="sound-text-marquee">${item.audioTitle || 'Christian Culture Worship'}</div>
                        </div>
                    </div>

                    <!-- Spinning Vinyl -->
                    <div class="vinyl-disc" title="Dźwięk: ${item.audioTitle || 'CC Music'}"></div>
                `;

                container.appendChild(slide);
            });

            setupIntersectionObserver();
        }

        // ── Auto-Play on Scroll Snap ──
        function setupIntersectionObserver() {
            if (observer) observer.disconnect();

            const options = {
                root: document.getElementById('shortsContainer'),
                threshold: 0.6
            };

            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const slide = entry.target;
                    const video = slide.querySelector('video');
                    const iframe = slide.querySelector('iframe');
                    const index = parseInt(slide.getAttribute('data-index') || '0', 10);

                    if (entry.isIntersecting) {
                        activeSlideIndex = index;
                        updateProgress();

                        // Play HTML5 Video
                        if (video) {
                            video.muted = isGlobalMuted;
                            video.play().catch(() => {});
                            video.ontimeupdate = updateVideoProgress;
                        }

                        // Activate YouTube Iframe Autoplay
                        if (iframe) {
                            const currentSrc = iframe.getAttribute('src');
                            if (currentSrc && !currentSrc.includes('autoplay=1')) {
                                iframe.setAttribute('src', currentSrc.replace('autoplay=0', 'autoplay=1'));
                            }
                        }
                    } else {
                        // Pause HTML5 Video
                        if (video) {
                            video.pause();
                            video.currentTime = 0;
                        }

                        // Pause YouTube Iframe
                        if (iframe) {
                            const currentSrc = iframe.getAttribute('src');
                            if (currentSrc && currentSrc.includes('autoplay=1')) {
                                iframe.setAttribute('src', currentSrc.replace('autoplay=1', 'autoplay=0'));
                            }
                        }
                    }
                });
            }, options);

            document.querySelectorAll('.short-slide').forEach(slide => observer.observe(slide));
        }

        function updateVideoProgress(e) {
            const video = e.target;
            if (!video.duration) return;
            const pct = (video.currentTime / video.duration) * 100;
            const bar = document.getElementById('shortsProgressFill');
            if (bar) bar.style.width = pct + '%';
        }

        function updateProgress() {
            const total = shortsData.length || 1;
            const pct = ((activeSlideIndex + 1) / total) * 100;
            const bar = document.getElementById('shortsProgressFill');
            if (bar) bar.style.width = pct + '%';
        }

        // ── Keyboard Arrows Support ──
        window.addEventListener('keydown', (e) => {
            const container = document.getElementById('shortsContainer');
            if (!container) return;

            const slideHeight = container.clientHeight;
            if (e.key === 'ArrowDown' || e.key === 'j') {
                e.preventDefault();
                container.scrollBy({ top: slideHeight, behavior: 'smooth' });
            } else if (e.key === 'ArrowUp' || e.key === 'k') {
                e.preventDefault();
                container.scrollBy({ top: -slideHeight, behavior: 'smooth' });
            } else if (e.key === 'm') {
                toggleGlobalMute();
            } else if (e.key === ' ') {
                e.preventDefault();
                const activeSlide = document.querySelectorAll('.short-slide')[activeSlideIndex];
                if (activeSlide) handleSlideTap(activeSlide);
            }
        });

        // ── Load Data ──
        async function loadShortsFeed() {
            try {
                const res = await fetch('data/shorts/shorts_feed.json?v=' + Date.now());
                if (res.ok) {
                    shortsData = await res.json();
                } else {
                    shortsData = FALLBACK_SHORTS;
                }
            } catch (err) {
                shortsData = FALLBACK_SHORTS;
            }

            renderSlides(shortsData);

            // If URL hash contains specific short ID, jump to it
            if (window.location.hash) {
                const targetId = window.location.hash.substring(1);
                setTimeout(() => {
                    const targetEl = document.getElementById(targetId);
                    if (targetEl) targetEl.scrollIntoView({ behavior: 'smooth' });
                }, 400);
            }
        }

        window.addEventListener('DOMContentLoaded', loadShortsFeed);
    </script>
</body>
</html>
