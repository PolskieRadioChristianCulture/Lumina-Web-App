<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>CC Master Control Room (Auto-Switch)</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; }
        #fade-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            opacity: 1; transition: opacity 0.8s ease; pointer-events: none;
        }
        #master-status {
            position: absolute; top: 20px; left: 20px; color: rgba(255,255,255,0.3);
            z-index: 10000; font-size: 10px; pointer-events: none; text-transform: uppercase; letter-spacing: 2px;
            display: none;
        }
    </style>
</head>
<body>
    <iframe id="channel-frame" allow="autoplay; camera; microphone; fullscreen; picture-in-picture; display-capture; clipboard-write; clipboard-read; accelerometer; encrypted-media; gyroscope; web-share"></iframe>
    <div id="fade-overlay"></div>
    <div id="master-status">MCR: INITIALIZING...</div>

    <script>
        const schedule = [
            { start: 0,  end: 6,  url: "cctv24-worship.html" },
            { start: 6,  end: 12, url: "zapolske-live.html" },
            { start: 12, end: 22, url: "biblia-spiewana-live.html" },
            { start: 22, end: 24, url: "cctv24-worship.html" }
        ];

        let currentUrl = null;
        let isApokalipsaActive = false;
        let apokalipsaDoneHours = { 9: false, 15: false, 21: false };
        let safetyTimeout = null;

        const frame = document.getElementById("channel-frame");
        const fade = document.getElementById("fade-overlay");
        const status = document.getElementById("master-status");

        // Listen for single episode completion event from apokalipsa-live.html
        window.addEventListener("message", (event) => {
            if (event.data && event.data.type === "APOKALIPSA_FINISHED") {
                console.log("MCR: Single episode ended! Returning to main channel immediately.");
                endApokalipsaSlot();
            }
        });

        function endApokalipsaSlot() {
            if (safetyTimeout) {
                clearTimeout(safetyTimeout);
                safetyTimeout = null;
            }
            if (isApokalipsaActive) {
                isApokalipsaActive = false;
                const baseChannel = getActiveBaseChannel();
                switchChannel(baseChannel);
            }
        }

        function getActiveBaseChannel() {
            const hour = new Date().getHours();
            if (hour >= 0 && hour < 6) return "cctv24-worship.html";
            if (hour >= 6 && hour < 12) return "zapolske-live.html";
            if (hour >= 12 && hour < 22) return "biblia-spiewana-live.html";
            return "cctv24-worship.html";
        }

        function checkSchedule() {
            const now = new Date();
            const hour = now.getHours();
            const min = now.getMinutes();

            // Trigger single episode broadcast exactly at 09:00, 15:00, 21:00
            if ((hour === 9 || hour === 15 || hour === 21) && min < 8) {
                if (!apokalipsaDoneHours[hour]) {
                    apokalipsaDoneHours[hour] = true;
                    isApokalipsaActive = true;
                    switchChannel("apokalipsa-live.html");
                    
                    // Safety timeout (6.5 mins max)
                    safetyTimeout = setTimeout(() => {
                        console.log("MCR: Safety timeout reached for Apokalipsa slot.");
                        endApokalipsaSlot();
                    }, 390000);
                    return;
                }
            } else {
                // Reset flags for upcoming hours
                if (hour !== 9) apokalipsaDoneHours[9] = false;
                if (hour !== 15) apokalipsaDoneHours[15] = false;
                if (hour !== 21) apokalipsaDoneHours[21] = false;
            }

            if (!isApokalipsaActive) {
                const targetChannel = getActiveBaseChannel();
                if (currentUrl !== targetChannel) {
                    switchChannel(targetChannel);
                }
            }
        }

        function switchChannel(newChannel) {
            console.log("MCR: Przełączanie kanału na " + newChannel);
            status.textContent = "MCR: " + newChannel;
            const isFirstLoad = (currentUrl === null);
            currentUrl = newChannel;
            
            if (isFirstLoad) {
                frame.src = newChannel + "?autoplay=1&t=" + Date.now();
                setTimeout(() => {
                    fade.style.opacity = "0";
                }, 600);
            } else {
                fade.style.opacity = "1";
                setTimeout(() => {
                    frame.src = newChannel + "?autoplay=1&t=" + Date.now();
                    setTimeout(() => {
                        fade.style.opacity = "0";
                    }, 800);
                }, 500);
            }
        }

        // Start checking every 10 seconds
        setInterval(checkSchedule, 10000);
        
        // Initial load
        window.addEventListener("DOMContentLoaded", () => {
            checkSchedule();
        });
    </script>
</body>
</html>
