<!DOCTYPE html>
<html lang="pl">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y4EFTVBPE3"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-Y4EFTVBPE3');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>CC Master Control Room (Auto-Switch)</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --gold-primary: #D4AF37;
            --gold-light: #ffffff;
            --gold-dark: #AA7C11;
            --bg-dark: #05070c;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Outfit', sans-serif;
        }

        .channel-frame {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.8s ease;
        }

        .channel-frame.active {
            opacity: 1;
            z-index: 2;
            pointer-events: auto;
        }

        .channel-frame.inactive {
            opacity: 0;
            z-index: 1;
            pointer-events: none;
        }

        #fade-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.8s ease;
            pointer-events: none;
            display: none;
        }

        /* --- FULL-SCREEN VIDEO BUMPER OVERLAY --- */
        #bumper-video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 10000;
            display: none;
            align-items: flex-end; /* Position info card at bottom so presenters' faces remain visible! */
            justify-content: center;
            opacity: 0;
            padding-bottom: 30px;
            transition: opacity 0.6s ease;
            overflow: hidden;
        }

        #bumper-video-overlay.show {
            display: flex;
            opacity: 1;
        }

        #bumperVideo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Ambient dark vignette gradient at bottom behind glass card */
        .bumper-vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.7) 100%);
            z-index: 2;
            pointer-events: none;
        }

        .bumper-glass-card {
            position: relative;
            z-index: 3;
            background: rgba(8, 10, 16, 0.45); /* Semi-transparent so background video is clearly visible */
            border: 1.5px solid rgba(212, 175, 55, 0.35);
            border-radius: 20px;
            padding: 20px 45px;
            text-align: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(212, 175, 55, 0.15);
            max-width: 780px;
            width: 85%;
            margin-bottom: 25px;
            overflow: hidden;
            animation: bumperPulse 3s infinite alternate ease-in-out;
        }

        @keyframes bumperPulse {
            0% { border-color: rgba(212, 175, 55, 0.35); box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(212, 175, 55, 0.15); }
            100% { border-color: rgba(212, 175, 55, 0.7); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 50px rgba(212, 175, 55, 0.3); }
        }

        .bumper-channel-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 3px;
            color: var(--gold-primary);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .bumper-channel-brand i {
            font-size: 1.1rem;
        }

        .bumper-next-tag {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #d4d4d8;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .bumper-program-title {
            font-family: 'Cinzel', serif;
            font-size: 2.1rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 1px;
            line-height: 1.25;
            text-shadow: 0 4px 20px rgba(0,0,0,0.9);
        }

        .bumper-program-desc {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 18px;
        }

        .bumper-progress-container {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            overflow: hidden;
        }

        .bumper-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold-primary), #ffffff);
            box-shadow: 0 0 15px var(--gold-primary);
        }

        #master-status {
            position: absolute; top: 20px; left: 20px; color: rgba(255,255,255,0.3);
            z-index: 10000; font-size: 10px; pointer-events: none; text-transform: uppercase; letter-spacing: 2px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- DUAL IFRAME ENGINE (ZERO BUFFER LAG) -->
    <iframe id="channel-frame-a" class="channel-frame active" allow="autoplay; camera; microphone; fullscreen; picture-in-picture; display-capture; clipboard-write; clipboard-read; accelerometer; encrypted-media; gyroscope; web-share"></iframe>
    <iframe id="channel-frame-b" class="channel-frame inactive" allow="autoplay; camera; microphone; fullscreen; picture-in-picture; display-capture; clipboard-write; clipboard-read; accelerometer; encrypted-media; gyroscope; web-share"></iframe>
    
    <div id="fade-overlay"></div>

    <!-- FULL-SCREEN VIDEO BUMPER OVERLAY -->
    <div id="bumper-video-overlay">
        <video id="bumperVideo" src="przebitka_cc.mp4" playsinline preload="auto"></video>
        <div class="bumper-vignette"></div>
        <div class="bumper-glass-card">
            <div class="bumper-channel-brand">
                <i class="fa-solid fa-tv"></i> TELEWIZJA CHRISTIAN CULTURE
            </div>
            <div class="bumper-next-tag">ZA CHWILĘ W PROGRAMIE</div>
            <h1 class="bumper-program-title" id="bumperProgramTitle">ŁADOWANIE PROGRAMU...</h1>
            <div class="bumper-program-desc" id="bumperProgramDesc">Zapraszamy na transmisję na żywo.</div>
            <div class="bumper-progress-container">
                <div class="bumper-progress-bar" id="bumperProgressBar"></div>
            </div>
        </div>
    </div>

    <div id="master-status">MCR: INITIALIZING...</div>

    <script>
        const programMeta = {
            "spiewajmy-panu-live.html": {
                title: "ŚPIEWAJMY PANU — BLOK MUZYCZNY",
                desc: "Najpiękniejsze utwory uwielbienia i nowości muzyczne Christian Culture Music"
            },
            "kino-live.html": {
                title: "CHRZEŚCIJAŃSKI BLOK FILMOWY",
                desc: "Wyjątkowe seanse filmowe i dokumentalne z przesłaniem na życzenie"
            },
            "studium-live.html": {
                title: "STUDIUM TELEWIZYJNE PISMA ŚWIĘTEGO",
                desc: "Wyczerpujący 572-odcinkowy wykład biblijny werset po wersecie"
            },
            "apokalipsa-live.html": {
                title: "APOKALIPSA DZIEŃ PO DNIU",
                desc: "Dzienny komentarz proroczy i analiza Księgi Objawienia św. Jana"
            },
            "apokalipsa-ksiega-nadziei-live.html": {
                title: "APOKALIPSA: KSIĘGA NADZIEI",
                desc: "24-lekcyjny cykl odkrywania nadziei w proroctwach biblijnych"
            },
            "biblia-spiewana-live.html": {
                title: "BIBLIA ŚPIEWANA & WORSHIP 24/7",
                desc: "Śpiewane Przypowieści Salomona oraz całodobowa muzyka uwielbienia"
            },
            "zapolske-live.html": {
                title: "ZJEDNOCZENI ZA POLSKĘ",
                desc: "Poranny blok modlitewny i transmisja radiowo-telewizyjna"
            },
            "swiadectwa-live.html": {
                title: "ŚWIADECTWA — HISTORIE WIARY",
                desc: "Poruszające opowieści nawrócenia, uzdrowień i cudów na niedzielne wieczory"
            },
            "nocne-czuwanie-live.html": {
                title: "NOCNE CZUWANIE & WORSHIP",
                desc: "Nocny blok kontemplacji z cyklem 23 rotacyjnych filmów wyciszenia i uwielbienia"
            },
            "cctv24-worship.html": {
                title: "NOCNE CZUWANIE & WORSHIP 24/7",
                desc: "Nocny strumień muzyczny i czuwanie modlitewne Christian Culture"
            }
        };

        const frameA = document.getElementById('channel-frame-a');
        const frameB = document.getElementById('channel-frame-b');
        const fade = document.getElementById('fade-overlay');
        const bumperOverlay = document.getElementById('bumper-video-overlay');
        const bumperVideo = document.getElementById('bumperVideo');
        const bumperTitle = document.getElementById('bumperProgramTitle');
        const bumperDesc = document.getElementById('bumperProgramDesc');
        const bumperProgress = document.getElementById('bumperProgressBar');
        const status = document.getElementById('master-status');

        let activeFrameIndex = 0; // 0 = Frame A, 1 = Frame B
        let currentUrl = null;
        let isSpecialSlotActive = false;
        let apokalipsaDoneHours = { 9: false, 15: false, 21: false };
        let ksiegaNadzieiDoneHours = { 10: false, 22: false };
        let studiumDoneHours = { 8: false, 20: false };
        let spiewajmyPanuDoneHours = { 16: false };
        let kinoDoneHours = { 18: false, 19: false };
        let isSafeMonetizationMode = false;
        let safetyTimeout = null;
        let isSwitchingWithBumper = false;

        function getActiveFrame() {
            return activeFrameIndex === 0 ? frameA : frameB;
        }

        function getInactiveFrame() {
            return activeFrameIndex === 0 ? frameB : frameA;
        }

        function endSpecialSlot() {
            if (safetyTimeout) {
                clearTimeout(safetyTimeout);
                safetyTimeout = null;
            }
            if (isSpecialSlotActive) {
                isSpecialSlotActive = false;
                const baseChannel = getActiveBaseChannel();
                switchChannel(baseChannel);
            }
        }

        function getActiveBaseChannel() {
            const now = new Date();
            const hour = now.getHours();

            if (hour >= 0 && hour < 6) return "nocne-czuwanie-live.html";
            if (hour >= 6 && hour < 10) return "zapolske-live.html";
            if (hour >= 16 && hour < 18) return "spiewajmy-panu-live.html";
            if (hour >= 18 && hour < 20) {
                const dayOfWeek = now.getDay();
                if (dayOfWeek === 0) return isSafeMonetizationMode ? "biblia-spiewana-live.html" : "swiadectwa-live.html";
                if (dayOfWeek === 6) return isSafeMonetizationMode ? "biblia-spiewana-live.html" : "kino-live.html";
                return "biblia-spiewana-live.html";
            }
            return "biblia-spiewana-live.html";
        }

        function checkSchedule() {
            if (isSwitchingWithBumper) return;

            const now = new Date();
            const hour = now.getHours();
            const min = now.getMinutes();

            // 1) Trigger "Studium Telewizyjne Pisma Świętego" (08:00, 20:00 - 60 min slot)
            if (hour === 8 || hour === 20) {
                if (min < 55) {
                    if (!studiumDoneHours[hour]) {
                        studiumDoneHours[hour] = true;
                        isSpecialSlotActive = true;
                        switchChannel("studium-live.html");

                        safetyTimeout = setTimeout(() => {
                            console.log("MCR: Safety timeout reached for Studium slot.");
                            endSpecialSlot();
                        }, 3300000);
                        return;
                    }
                } else if (isSpecialSlotActive && currentUrl === "studium-live.html") {
                    endSpecialSlot();
                }
            } else {
                if (hour !== 8) studiumDoneHours[8] = false;
                if (hour !== 20) studiumDoneHours[20] = false;
            }

            // 2) Trigger "Apokalipsa dzień po dniu" (09:00, 15:00, 21:00 - 6 min slot)
            if (hour === 9 || hour === 15 || hour === 21) {
                if (min < 6) {
                    if (!apokalipsaDoneHours[hour]) {
                        apokalipsaDoneHours[hour] = true;
                        isSpecialSlotActive = true;
                        switchChannel("apokalipsa-live.html");
                        
                        safetyTimeout = setTimeout(() => {
                            console.log("MCR: Safety timeout reached for Apokalipsa slot.");
                            endSpecialSlot();
                        }, 390000);
                        return;
                    }
                } else if (isSpecialSlotActive && currentUrl === "apokalipsa-live.html") {
                    endSpecialSlot();
                }
            } else {
                if (hour !== 9) apokalipsaDoneHours[9] = false;
                if (hour !== 15) apokalipsaDoneHours[15] = false;
                if (hour !== 21) apokalipsaDoneHours[21] = false;
            }

            // 3) Trigger "Apokalipsa: Księga Nadziei" (10:00, 22:00 - 60 min slot window)
            if (hour === 10 || hour === 22) {
                if (min < 55) {
                    if (!ksiegaNadzieiDoneHours[hour]) {
                        ksiegaNadzieiDoneHours[hour] = true;
                        isSpecialSlotActive = true;
                        switchChannel("apokalipsa-ksiega-nadziei-live.html");

                        safetyTimeout = setTimeout(() => {
                            console.log("MCR: Safety timeout reached for Księga Nadziei slot.");
                            endSpecialSlot();
                        }, 3300000);
                        return;
                    }
                } else if (isSpecialSlotActive && currentUrl === "apokalipsa-ksiega-nadziei-live.html") {
                    endSpecialSlot();
                }
            } else {
                if (hour !== 10) ksiegaNadzieiDoneHours[10] = false;
                if (hour !== 22) ksiegaNadzieiDoneHours[22] = false;
            }

            // 4) Trigger "Śpiewajmy Panu" (16:00 - 18:00 daily 2-hour music block)
            if (hour >= 16 && hour < 18) {
                isSpecialSlotActive = true;
                if (currentUrl !== "spiewajmy-panu-live.html") {
                    switchChannel("spiewajmy-panu-live.html");
                }
                return;
            } else {
                if (isSpecialSlotActive && currentUrl === "spiewajmy-panu-live.html") {
                    isSpecialSlotActive = false;
                }
            }

            // 5) Trigger Weekend Evening Shows (18:00 - 20:00): Sobota = Kino, Niedziela = Świadectwa
            const dayOfWeek = now.getDay();
            if (hour >= 18 && hour < 20) {
                if (dayOfWeek === 6) { // Sobota -> Chrześcijański Blok Filmowy
                    isSpecialSlotActive = true;
                    const targetFilmChannel = isSafeMonetizationMode ? "biblia-spiewana-live.html" : "kino-live.html";
                    if (currentUrl !== targetFilmChannel) {
                        switchChannel(targetFilmChannel);
                    }
                    return;
                } else if (dayOfWeek === 0) { // Niedziela -> Świadectwa
                    isSpecialSlotActive = true;
                    const targetTestimonyChannel = isSafeMonetizationMode ? "biblia-spiewana-live.html" : "swiadectwa-live.html";
                    if (currentUrl !== targetTestimonyChannel) {
                        switchChannel(targetTestimonyChannel);
                    }
                    return;
                }
            } else {
                if (isSpecialSlotActive && (currentUrl === "kino-live.html" || currentUrl === "swiadectwa-live.html" || currentUrl === "biblia-spiewana-live.html")) {
                    isSpecialSlotActive = false;
                }
            }

            if (!isSpecialSlotActive) {
                const targetChannel = getActiveBaseChannel();
                if (currentUrl !== targetChannel) {
                    switchChannel(targetChannel);
                }
            }
        }

        function switchChannel(newChannel) {
            console.log("MCR: Przełączanie kanału na " + newChannel);
            status.textContent = "MCR: " + newChannel;
            const isFirstLoad = (currentUrl === null);
            currentUrl = newChannel;

            const cleanChannelKey = newChannel.split('?')[0];
            const meta = programMeta[cleanChannelKey] || {
                title: "PROGRAM CHRISTIAN CULTURE",
                desc: "Emisja na żywo w Christian Culture TV"
            };

            const activeFrame = getActiveFrame();
            const inactiveFrame = getInactiveFrame();

            if (isFirstLoad) {
                // First load -> direct smooth load on Active Frame
                activeFrame.src = newChannel + "?autoplay=1&t=" + Date.now();
                fade.style.display = "block";
                fade.style.opacity = "1";
                setTimeout(() => {
                    fade.style.opacity = "0";
                    setTimeout(() => { fade.style.display = "none"; }, 800);
                }, 600);
            } else {
                // Subsequent program switches -> Launch 10-second Video Bumper + Dual-Iframe Preload!
                isSwitchingWithBumper = true;
                bumperTitle.textContent = meta.title;
                bumperDesc.textContent = meta.desc;
                
                bumperProgress.style.transition = 'none';
                bumperProgress.style.width = '0%';

                // 1) IMMEDIATELY STOP & MUTE OUTGOING FRAME AUDIO SO ONLY BUMPER VIDEO AUDIO PLAYS!
                try {
                    if (activeFrame && activeFrame.contentWindow) {
                        activeFrame.contentWindow.postMessage('{"event":"command","func":"mute","args":""}', '*');
                        activeFrame.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
                    }
                    activeFrame.src = 'about:blank';
                } catch(e) {}

                // 2) Start playing video bumper
                bumperOverlay.classList.add('show');
                try {
                    bumperVideo.currentTime = 0;
                    bumperVideo.muted = false;
                    const playPromise = bumperVideo.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(err => {
                            console.log("MCR Video Bumper autoplay muted fallback:", err);
                            bumperVideo.muted = true;
                            bumperVideo.play();
                        });
                    }
                } catch(e) {
                    console.error("Video Bumper play error:", e);
                }

                // Determine video duration (default 9 seconds fallback)
                const durationSec = (bumperVideo.duration && !isNaN(bumperVideo.duration)) ? bumperVideo.duration : 9;

                setTimeout(() => {
                    bumperProgress.style.transition = `width ${durationSec}s linear`;
                    bumperProgress.style.width = '100%';
                }, 50);

                // Load upcoming channel silently on INACTIVE frame in background 2.5 seconds before bumper finishes
                const preloadTime = Math.max((durationSec - 2.5) * 1000, 1000);
                setTimeout(() => {
                    inactiveFrame.src = newChannel + "?autoplay=1&t=" + Date.now();
                }, preloadTime);

                // Swap frames seamlessly 0.6s before video finishes
                const switchLeadTime = Math.max((durationSec - 0.6) * 1000, 3000);

                setTimeout(() => {
                    // Make inactive frame active and fade out bumper
                    inactiveFrame.classList.remove('inactive');
                    inactiveFrame.classList.add('active');

                    activeFrame.classList.remove('active');
                    activeFrame.classList.add('inactive');

                    // Swap index pointer
                    activeFrameIndex = activeFrameIndex === 0 ? 1 : 0;

                    // Fade out bumper overlay
                    bumperOverlay.style.opacity = '0';

                    setTimeout(() => {
                        bumperOverlay.classList.remove('show');
                        bumperOverlay.style.opacity = '1';
                        bumperProgress.style.width = '0%';
                        // Clean up old frame to free memory
                        activeFrame.src = 'about:blank';
                        isSwitchingWithBumper = false;
                    }, 600);

                }, switchLeadTime);
            }
        }

        // Forward click/touch interaction to unmute nested iframe & video bumper
        function unmuteSubframe() {
            try {
                if (bumperVideo) {
                    bumperVideo.muted = false;
                }
                const frame = getActiveFrame();
                if (frame && frame.contentWindow) {
                    frame.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
                    frame.contentWindow.postMessage('{"event":"command","func":"setVolume","args":[100]}', '*');
                    frame.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
                }
            } catch(e) {}
        }
        window.addEventListener('click', unmuteSubframe);
        // Listen for completion signals from sub-channels (Apokalipsa, Studium, Księga Nadziei, etc.)
        window.addEventListener('message', (event) => {
            if (!event || !event.data) return;
            const type = event.data.type || event.data;
            if (type === 'APOKALIPSA_FINISHED' || type === 'STUDIUM_FINISHED' || type === 'KSIEGA_NADZIEI_FINISHED' || type === 'PROGRAM_FINISHED') {
                console.log("MCR: Received completion signal (" + type + ") from sub-channel. Ending special slot immediately!");
                endSpecialSlot();
            }
        });

        // Start checking schedule every 10 seconds
        setInterval(checkSchedule, 10000);
        
        // Initial load
        window.addEventListener("DOMContentLoaded", () => {
            checkSchedule();
        });
    </script>
</body>
</html>
