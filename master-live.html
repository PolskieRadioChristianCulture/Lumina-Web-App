<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>CC Master Control Room (Auto-Switch)</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; }
        #fade-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            opacity: 1; transition: opacity 0.8s ease; pointer-events: none;
        }
        #master-status {
            position: absolute; top: 20px; left: 20px; color: rgba(255,255,255,0.3);
            z-index: 10000; font-size: 10px; pointer-events: none; text-transform: uppercase; letter-spacing: 2px;
            display: none;
        }
    </style>
</head>
<body>
    <iframe id="channel-frame" allow="autoplay; camera; microphone; fullscreen; picture-in-picture; display-capture; clipboard-write; clipboard-read; accelerometer; encrypted-media; gyroscope; web-share"></iframe>
    <div id="fade-overlay"></div>
    <div id="master-status">MCR: INITIALIZING...</div>

    <script>
        const schedule = [
            { start: 0,  end: 6,  url: "cctv24-worship.html" },
            { start: 6,  end: 12, url: "zapolske-live.html" },
            { start: 12, end: 22, url: "biblia-spiewana-live.html" },
            { start: 22, end: 24, url: "cctv24-worship.html" }
        ];

        let currentUrl = null;
        const frame = document.getElementById("channel-frame");
        const fade = document.getElementById("fade-overlay");
        const status = document.getElementById("master-status");

        function getActiveChannel() {
            const now = new Date();
            const hour = now.getHours();
            const min = now.getMinutes();
            const timeInMinutes = hour * 60 + min;

            // Emisje Specjalne: "Apokalipsa dzień po dniu" (09:00-09:10, 15:00-15:10, 21:00-21:10)
            if ((timeInMinutes >= 9 * 60 && timeInMinutes < 9 * 60 + 10) ||
                (timeInMinutes >= 15 * 60 && timeInMinutes < 15 * 60 + 10) ||
                (timeInMinutes >= 21 * 60 && timeInMinutes < 21 * 60 + 10)) {
                return "apokalipsa-live.html";
            }

            if (hour >= 0 && hour < 6) return "cctv24-worship.html";
            if (hour >= 6 && hour < 12) return "zapolske-live.html";
            if (hour >= 12 && hour < 22) return "biblia-spiewana-live.html";
            return "cctv24-worship.html";
        }

        function checkSchedule() {
            const targetChannel = getActiveChannel();
            if (currentUrl !== targetChannel) {
                switchChannel(targetChannel);
            }
        }

        function switchChannel(newChannel) {
            console.log("MCR: Przełączanie kanału na " + newChannel);
            status.textContent = "MCR: " + newChannel;
            const isFirstLoad = (currentUrl === null);
            currentUrl = newChannel;
            
            if (isFirstLoad) {
                frame.src = newChannel + "?autoplay=1&t=" + Date.now();
                setTimeout(() => {
                    fade.style.opacity = "0";
                }, 600);
            } else {
                fade.style.opacity = "1";
                setTimeout(() => {
                    frame.src = newChannel + "?autoplay=1&t=" + Date.now();
                    setTimeout(() => {
                        fade.style.opacity = "0";
                    }, 800);
                }, 500);
            }
        }

        // Start checking every 10 seconds
        setInterval(checkSchedule, 10000);
        
        // Initial load
        window.addEventListener("DOMContentLoaded", () => {
            checkSchedule();
        });
    </script>
</body>
</html>
