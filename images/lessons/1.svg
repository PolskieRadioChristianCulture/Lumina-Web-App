<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Page/Parchment Gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Celestial Rays Radial -->
    <radialGradient id="radialRays" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#radialRays)"/>

  <!-- Ornate Corner Accents -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.4"/>
  <path d="M 780 50 L 780 20 L 750 20" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.4"/>
  <path d="M 20 400 L 20 430 L 50 430" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.4"/>
  <path d="M 780 400 L 780 430 L 750 430" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.4"/>

  <!-- Subtle Stars / Particles -->
  <circle cx="120" cy="80" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="680" cy="110" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="220" cy="360" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="580" cy="330" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="340" cy="70" r="2" fill="#f59e0b" opacity="0.7"/>
  <circle cx="480" cy="65" r="2" fill="#f59e0b" opacity="0.7"/>

  <!-- Top Badge: LEKCJA N -->
  <g transform="translate(400, 48)">
    <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#000000" fill-opacity="0.6" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="0" y="5" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="900" letter-spacing="3" text-anchor="middle">ZASADA WIARY 1</text>
  </g>

  <!-- Central Thematic Symbol -->
  
      <!-- Open Bible with divine light rays -->
      <g transform="translate(400, 190) scale(1.3)">
        <path d="M-90 -10 Q-45 -40 0 -15 Q45 -40 90 -10 L90 50 Q45 20 0 45 Q-45 20 -90 50 Z" fill="url(#pageGrad)" stroke="#d97706" stroke-width="3" filter="url(#glow)"/>
        <path d="M0 -15 L0 45" stroke="#b45309" stroke-width="4"/>
        <!-- Text lines simulation on parchment -->
        <line x1="-70" y1="0" x2="-15" y2="-5" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="-70" y1="12" x2="-15" y2="7" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="-70" y1="24" x2="-25" y2="19" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="15" y1="-5" x2="70" y2="0" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="15" y1="7" x2="70" y2="12" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="25" y1="19" x2="70" y2="24" stroke="#78350f" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Divine Light Burst above bible -->
        <circle cx="0" cy="-45" r="8" fill="#fbbf24" filter="url(#glow)"/>
        <line x1="0" y1="-65" x2="0" y2="-25" stroke="#fde68a" stroke-width="3" stroke-linecap="round"/>
        <line x1="-20" y1="-45" x2="20" y2="-45" stroke="#fde68a" stroke-width="3" stroke-linecap="round"/>
        <line x1="-14" y1="-59" x2="14" y2="-31" stroke="#fde68a" stroke-width="2" stroke-linecap="round"/>
        <line x1="-14" y1="-31" x2="14" y2="-59" stroke="#fde68a" stroke-width="2" stroke-linecap="round"/>
      </g>
    

  <!-- Bottom Vignette / Overlay for Text Legibility -->
  <rect y="290" width="800" height="160" fill="url(#bgGrad)" opacity="0.85"/>
  <rect y="290" width="800" height="160" fill="black" opacity="0.3"/>

  <!-- Title & Subtitle -->
  <text x="400" y="375" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="900" letter-spacing="2" text-anchor="middle" filter="url(#glow)">PISMO ŚWIĘTE</text>
  <text x="400" y="405" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle" opacity="0.9">Natchnione Słowo Boga i Źródło Prawdy</text>
</svg>