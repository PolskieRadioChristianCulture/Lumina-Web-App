<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Page/Parchment Gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Celestial Rays Radial -->
    <radialGradient id="radialRays" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#radialRays)"/>

  <!-- Ornate Corner Accents -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.4"/>
  <path d="M 780 50 L 780 20 L 750 20" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.4"/>
  <path d="M 20 400 L 20 430 L 50 430" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.4"/>
  <path d="M 780 400 L 780 430 L 750 430" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.4"/>

  <!-- Subtle Stars / Particles -->
  <circle cx="120" cy="80" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="680" cy="110" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="220" cy="360" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="580" cy="330" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="340" cy="70" r="2" fill="#fbbf24" opacity="0.7"/>
  <circle cx="480" cy="65" r="2" fill="#fbbf24" opacity="0.7"/>

  <!-- Top Badge: LEKCJA N -->
  <g transform="translate(400, 48)">
    <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#000000" fill-opacity="0.6" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="0" y="5" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="900" letter-spacing="3" text-anchor="middle">ZASADA WIARY 19</text>
  </g>

  <!-- Central Thematic Symbol -->
  
      <!-- Two Stone Tablets of Decalogue with Roman Numerals -->
      <g transform="translate(400, 190) scale(1.3)">
        <!-- Left Tablet -->
        <path d="M-45 -40 Q-25 -55 -5 -40 L-5 45 L-45 45 Z" fill="#3f3f46" stroke="#fbbf24" stroke-width="3" filter="url(#glow)"/>
        <!-- Right Tablet -->
        <path d="M5 -40 Q25 -55 45 -40 L45 45 L5 45 Z" fill="#3f3f46" stroke="#fbbf24" stroke-width="3" filter="url(#glow)"/>
        <!-- Inscriptions I-IV and V-X -->
        <text x="-25" y="-15" fill="#fef08a" font-size="12" font-family="serif" font-weight="bold" text-anchor="middle">I - IV</text>
        <text x="25" y="-15" fill="#fef08a" font-size="12" font-family="serif" font-weight="bold" text-anchor="middle">V - X</text>
        <line x1="-35" y1="5" x2="-15" y2="5" stroke="#a1a1aa" stroke-width="2"/>
        <line x1="-35" y1="20" x2="-15" y2="20" stroke="#a1a1aa" stroke-width="2"/>
        <line x1="15" y1="5" x2="35" y2="5" stroke="#a1a1aa" stroke-width="2"/>
        <line x1="15" y1="20" x2="35" y2="20" stroke="#a1a1aa" stroke-width="2"/>
      </g>
    

  <!-- Bottom Vignette / Overlay for Text Legibility -->
  <rect y="290" width="800" height="160" fill="url(#bgGrad)" opacity="0.85"/>
  <rect y="290" width="800" height="160" fill="black" opacity="0.3"/>

  <!-- Title & Subtitle -->
  <text x="400" y="375" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="900" letter-spacing="2" text-anchor="middle" filter="url(#glow)">PRAWO BOŻE</text>
  <text x="400" y="405" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle" opacity="0.9">Dziesięć Przykazań – Wieczny Wzorzec Sprawiedliwości</text>
</svg>