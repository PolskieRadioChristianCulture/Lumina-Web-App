<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#170500"/>
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Page/Parchment Gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Celestial Rays Radial -->
    <radialGradient id="radialRays" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#radialRays)"/>

  <!-- Ornate Corner Accents -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.4"/>
  <path d="M 780 50 L 780 20 L 750 20" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.4"/>
  <path d="M 20 400 L 20 430 L 50 430" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.4"/>
  <path d="M 780 400 L 780 430 L 750 430" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.4"/>

  <!-- Subtle Stars / Particles -->
  <circle cx="120" cy="80" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="680" cy="110" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="220" cy="360" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="580" cy="330" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="340" cy="70" r="2" fill="#f59e0b" opacity="0.7"/>
  <circle cx="480" cy="65" r="2" fill="#f59e0b" opacity="0.7"/>

  <!-- Top Badge: LEKCJA N -->
  <g transform="translate(400, 48)">
    <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#000000" fill-opacity="0.6" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="0" y="5" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="900" letter-spacing="3" text-anchor="middle">ZASADA WIARY 13</text>
  </g>

  <!-- Central Thematic Symbol -->
  
      <!-- Angel Flying with Everlasting Gospel Trumpet -->
      <g transform="translate(400, 190) scale(1.3)">
        <!-- Wings of the Angel -->
        <path d="M0 10 Q-35 -40 -70 -25 Q-40 5 0 25 Q40 5 70 -25 Q35 -40 0 10 Z" fill="#fde68a" filter="url(#glow)"/>
        <!-- Golden Trumpet -->
        <path d="M-15 0 L40 -25 L45 -20 L40 -15 Z" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
        <circle cx="-15" cy="0" r="8" fill="#fff" filter="url(#glow)"/>
        <path d="M45 -30 L60 -35 L60 -10 L45 -15 Z" fill="#f59e0b" filter="url(#glow)"/>
      </g>
    

  <!-- Bottom Vignette / Overlay for Text Legibility -->
  <rect y="290" width="800" height="160" fill="url(#bgGrad)" opacity="0.85"/>
  <rect y="290" width="800" height="160" fill="black" opacity="0.3"/>

  <!-- Title & Subtitle -->
  <text x="400" y="375" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="900" letter-spacing="2" text-anchor="middle" filter="url(#glow)">OSTATEK I JEGO MISJA</text>
  <text x="400" y="405" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle" opacity="0.9">Orędzie Trzech Aniołów dla Świata</text>
</svg>