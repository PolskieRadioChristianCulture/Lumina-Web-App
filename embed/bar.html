<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Christian Culture – Audio Player Bar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            onyx: { 950: '#06080b', 900: '#0d0f14', 850: '#11151e', 800: '#161b26' },
            sacredGold: {
              100: '#fff7d6', 200: '#fae69e', 300: '#f5dd8c', 400: '#e6ca65',
              500: '#c5a059', 600: '#a37f37', 700: '#7e6024'
            }
          },
          fontFamily: {
            serif: ['Cinzel', 'Georgia', 'serif'],
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      background: transparent !important;
    }
    .sacred-play-btn {
      background: radial-gradient(circle at 35% 30%, #fae69e 0%, #c5a059 55%, #806225 100%);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.8), 0 0 20px rgba(203, 162, 88, 0.4), inset 0 1px 1.5px rgba(255, 255, 255, 0.65);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sacred-play-btn:hover {
      background: radial-gradient(circle at 35% 30%, #fff4be 0%, #dbb263 55%, #93712b 100%);
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.9), 0 0 28px rgba(230, 202, 101, 0.7), inset 0 1.5px 2px rgba(255, 255, 255, 0.85);
      transform: scale(1.04);
    }
    .sacred-play-btn:active {
      transform: scale(0.96);
    }
    .sacred-volume-slider {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 9999px;
      background: #1e2534;
      outline: none;
    }
    .sacred-volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff3c4 15%, #c5a059 75%, #7e6024 100%);
      box-shadow: 0 0 10px 1px rgba(230, 202, 101, 0.8);
      cursor: pointer;
      border: 1px solid #f5dd8c;
    }
    .sacred-volume-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff3c4 15%, #c5a059 75%, #7e6024 100%);
      box-shadow: 0 0 10px 1px rgba(230, 202, 101, 0.8);
      border: 1px solid #f5dd8c;
      cursor: pointer;
    }
    .eq-bar {
      width: 3px;
      border-radius: 9999px;
      background: linear-gradient(180deg, #f5dd8c 0%, #c5a059 100%);
      height: 4px;
      transition: height 0.15s ease;
    }
    .is-playing .eq-bar:nth-child(1) { animation: eqBarPulse 0.85s ease-in-out infinite alternate; }
    .is-playing .eq-bar:nth-child(2) { animation: eqBarPulse 0.65s ease-in-out infinite alternate 0.15s; }
    .is-playing .eq-bar:nth-child(3) { animation: eqBarPulse 0.95s ease-in-out infinite alternate 0.3s; }
    .is-playing .eq-bar:nth-child(4) { animation: eqBarPulse 0.75s ease-in-out infinite alternate 0.1s; }
    @keyframes eqBarPulse {
      0% { height: 4px; }
      100% { height: 16px; }
    }
    .crossfade-card {
      transition: opacity 600ms cubic-bezier(0.4, 0, 0.2, 1), transform 600ms cubic-bezier(0.4, 0, 0.2, 1);
      will-change: opacity, transform;
    }
  </style>
</head>
<body class="bg-transparent text-[#fdfbf7] font-sans antialiased p-0 m-0 overflow-hidden select-none">
  <audio id="audio-live-engine" preload="none"></audio>

  <div class="w-full bg-[#0d0f14] border border-[rgba(197,160,89,0.35)] rounded-2xl p-2.5 sm:p-3 shadow-[0_16px_45px_rgba(0,0,0,0.9)] relative overflow-hidden box-border">
    <!-- Blask tła -->
    <div class="absolute -top-10 -left-10 w-40 h-40 bg-[#c5a059]/10 rounded-full blur-2xl pointer-events-none"></div>

    <div class="flex flex-col sm:flex-row items-center justify-between gap-2.5 relative z-10">
      
      <!-- 1. Lewy blok: stacje + przycisk Play -->
      <div class="flex items-center space-x-2 flex-shrink-0">
        <button type="button" onclick="changeStationOffset(-1)" title="Poprzednia stacja" aria-label="Poprzednia stacja" class="w-8 h-8 rounded-full bg-[#141824] border border-[#232b3b] text-[#7e8a9f] hover:text-[#f5dd8c] hover:border-[#c5a059]/40 flex items-center justify-center transition-all active:scale-95">
          <svg class="w-4 h-4 fill-none stroke-current" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>

        <button type="button" id="master-play-btn" onclick="toggleAudioStreaming()" title="Włącz / Zatrzymaj odtwarzanie" aria-label="Włącz lub zatrzymaj radio" class="w-12 h-12 rounded-full sacred-play-btn flex items-center justify-center text-black cursor-pointer flex-shrink-0">
          <svg id="icon-play-state" class="w-5 h-5 fill-black ml-0.5 drop-shadow" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause-state" class="w-5 h-5 fill-black hidden drop-shadow" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>

        <button type="button" onclick="changeStationOffset(1)" title="Następna stacja" aria-label="Następna stacja" class="w-8 h-8 rounded-full bg-[#141824] border border-[#232b3b] text-[#7e8a9f] hover:text-[#f5dd8c] hover:border-[#c5a059]/40 flex items-center justify-center transition-all active:scale-95">
          <svg class="w-4 h-4 fill-none stroke-current" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>

      <!-- 2. Środek: rotacja RDS / stacje / ekosystem -->
      <div id="crossfade-carousel-box" onmouseenter="pauseCarousel()" onmouseleave="resumeCarousel()" class="flex-1 w-full min-w-0 relative h-[48px] overflow-hidden bg-[#07090d]/90 rounded-xl border border-[rgba(197,160,89,0.24)] px-2.5 py-1 flex items-center">
        <!-- RDS -->
        <div id="slide-item-0" class="crossfade-card absolute inset-0 px-3 flex flex-col justify-center opacity-100 scale-100 pointer-events-auto">
          <div class="flex items-center justify-between gap-1.5">
            <div class="flex items-center gap-1.5 min-w-0">
              <span class="w-2 h-2 rounded-full bg-[#e6ca65] shadow-[0_0_6px_#f5dd8c] animate-pulse flex-shrink-0"></span>
              <span class="text-[8px] font-black tracking-wider text-[#f5dd8c] uppercase bg-[#181d28] border border-[#c5a059]/30 px-1 py-0.5 rounded flex-shrink-0 font-mono">NA ŻYWO</span>
              <h2 id="rds-active-title" class="text-xs font-bold text-[#fdfbf7] truncate">Polskie Radio CC</h2>
            </div>
            <span class="text-[9px] text-[#f5dd8c] font-mono bg-[#11151e] px-1.5 py-0.5 rounded border border-[#c5a059]/25 flex-shrink-0">192 kbps HD</span>
          </div>
          <p id="rds-active-subtitle" class="text-[10px] text-[#7e8a9f] truncate mt-0.5">Strumień: Polskie Radio Christian Culture</p>
        </div>

        <!-- 3 stacje szybki wybór -->
        <div id="slide-item-1" class="crossfade-card absolute inset-0 px-2 flex items-center opacity-0 scale-[0.98] pointer-events-none">
          <div class="grid grid-cols-3 gap-1 w-full">
            <button type="button" onclick="selectDirectStation('prcc')" id="channel-btn-prcc" class="py-1 px-1 rounded-md text-[10px] font-bold text-center truncate bg-[#c5a059] text-black">Radio CC</button>
            <button type="button" onclick="selectDirectStation('cc')" id="channel-btn-cc" class="py-1 px-1 rounded-md text-[10px] font-bold text-center truncate bg-[#131722] text-[#7e8a9f] hover:text-white border border-[#232b3b]">Muzyka</button>
            <button type="button" onclick="selectDirectStation('biblia')" id="channel-btn-biblia" class="py-1 px-1 rounded-md text-[10px] font-bold text-center truncate bg-[#131722] text-[#7e8a9f] hover:text-white border border-[#232b3b]">Biblia</button>
          </div>
        </div>

        <!-- Ekosystem oferta -->
        <div id="slide-item-2" class="crossfade-card absolute inset-0 px-2 flex items-center opacity-0 scale-[0.98] pointer-events-none">
          <div class="w-full flex items-center justify-between bg-[#11151e]/95 border border-[#c5a059]/30 rounded-md px-2 py-1">
            <div class="flex items-center gap-1.5 min-w-0 pr-1">
              <span id="promo-category-badge" class="text-[8px] font-black uppercase px-1 py-0.5 rounded bg-[#c5a059] text-black font-mono">PORTALE</span>
              <div class="min-w-0">
                <div id="promo-offer-headline" class="text-[11px] font-bold text-[#fdfbf7] truncate">LUMINA Społeczność</div>
              </div>
            </div>
            <a id="promo-external-link" href="https://polskieradio.cc/lumina" target="_blank" rel="noopener noreferrer" class="flex-shrink-0 px-2 py-0.5 rounded bg-[#c5a059]/20 hover:bg-[#c5a059] text-[#f5dd8c] hover:text-black font-bold text-[10px]">Otwórz ↗</a>
          </div>
        </div>

        <!-- Tożsamość Christian Culture -->
        <div id="slide-item-3" class="crossfade-card absolute inset-0 px-2.5 flex flex-col justify-center opacity-0 scale-[0.98] pointer-events-none">
          <a href="https://polskieradio.cc" target="_blank" rel="noopener noreferrer" class="group block">
            <div class="flex items-center gap-1.5">
              <span class="font-serif text-xs font-bold text-[#fdfbf7] group-hover:text-[#f5dd8c] tracking-wide uppercase">CHRISTIAN CULTURE</span>
              <span class="text-[8px] text-[#c5a059] font-mono px-1 py-0.2 rounded border border-[#c5a059]/30 bg-[#121620]">polskieradio.cc ↗</span>
            </div>
            <p class="font-sans text-[9px] tracking-widest text-[#c5a059] uppercase font-bold">EKOSYSTEM OSOBISTEGO UŚWIĘCENIA</p>
          </a>
        </div>
      </div>

      <!-- 3. Prawy blok: EQ + Głośność + Linki -->
      <div class="flex items-center space-x-2 flex-shrink-0">
        <!-- EQ -->
        <div id="sacred-audio-eq" class="flex items-end gap-0.5 h-4 w-5 px-0.5" title="Korektor audio">
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
        </div>

        <!-- Głośność -->
        <div class="flex items-center space-x-1.5 bg-[#121620] px-2 py-1 rounded-lg border border-[#232b3b]">
          <button type="button" id="btn-vol-mute" onclick="toggleVolumeMute()" title="Wycisz" aria-label="Wycisz dźwięk" class="text-[#7e8a9f] hover:text-[#f5dd8c]">
            <svg id="vol-active-icon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
            <svg id="vol-muted-icon" class="w-3.5 h-3.5 hidden text-red-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/></svg>
          </button>
          <input id="master-volume-fader" type="range" min="0" max="1" step="0.02" value="0.85" oninput="changeMasterVolume(this.value)" class="sacred-volume-slider w-14 cursor-pointer" title="Głośność" aria-label="Regulacja głośności">
        </div>

        <!-- Link zewnętrzny -->
        <a href="https://polskieradio.cc" target="_blank" rel="noopener noreferrer" title="Przejdź do portalu Polskie Radio CC" class="px-2 py-1 rounded-lg bg-[#141824] hover:bg-[#1a2130] text-[#f5dd8c] border border-[#c5a059]/40 text-[10px] font-bold flex items-center gap-1">
          <span>PORTAL</span>
          <span>↗</span>
        </a>
      </div>

    </div>

    <!-- Pasek wskaźników -->
    <div class="mt-1.5 pt-1.5 border-t border-[rgba(197,160,89,0.14)] flex items-center justify-between text-[9px] text-[#7e8a9f]">
      <div class="flex items-center space-x-1">
        <button type="button" onclick="displayTargetSlide(0)" id="dot-indicator-0" aria-label="Plansza 1" class="w-1.5 h-1.5 rounded-full bg-[#c5a059] shadow-[0_0_4px_#f5dd8c]"></button>
        <button type="button" onclick="displayTargetSlide(1)" id="dot-indicator-1" aria-label="Plansza 2" class="w-1.5 h-1.5 rounded-full bg-[#1e2534]"></button>
        <button type="button" onclick="displayTargetSlide(2)" id="dot-indicator-2" aria-label="Plansza 3" class="w-1.5 h-1.5 rounded-full bg-[#1e2534]"></button>
        <button type="button" onclick="displayTargetSlide(3)" id="dot-indicator-3" aria-label="Plansza 4" class="w-1.5 h-1.5 rounded-full bg-[#1e2534]"></button>
      </div>
      <div class="flex items-center space-x-2 font-mono">
        <span id="active-station-badge" class="text-[#f5dd8c] font-semibold">POLSKIE RADIO CC</span>
        <span class="text-[#3c4556]">|</span>
        <a href="https://polskieradio.cc/widget" target="_blank" rel="noopener noreferrer" class="text-[#c5a059] hover:underline">Pobierz ten widget</a>
      </div>
    </div>
  </div>

  <script>
    const RADIO_STATIONS = [
      { id: 'prcc', name: 'Polskie Radio CC', streamUrl: 'https://stream.zeno.fm/vz96pvl3pnktv', caption: 'Strumień: Polskie Radio Christian Culture' },
      { id: 'cc', name: 'Christian Culture', streamUrl: 'https://stream.zeno.fm/umej2cuqncluv', caption: 'Strumień: Christian Culture – Muzyka & Tradycja' },
      { id: 'biblia', name: 'Biblia Audio', streamUrl: 'https://stream.zeno.fm/gn3uhltrrytuv', caption: 'Strumień: Biblia Audio – Słowo Boże Non-Stop' }
    ];

    const ECOSYSTEM_SERVICES = [
      { catLabel: 'Portal Główny', title: 'Strona Główna CC', link: 'https://polskieradio.cc' },
      { catLabel: 'Społeczność', title: 'Portal LUMINA', link: 'https://polskieradio.cc/lumina' },
      { catLabel: 'Player', title: 'Odtwarzacz Radiowy', link: 'https://polskieradio.cc/player' },
      { catLabel: 'Akademia', title: 'Kurs Codzienny CC', link: 'https://polskieradio.cc/akademia' },
      { catLabel: 'Pismo Święte', title: 'MojaBiblia Interlinearna', link: 'https://polskieradio.cc/mojabiblia' },
      { catLabel: 'Wiadomości', title: 'CCN News Wiadomości', link: 'https://polskieradio.cc/news' },
      { catLabel: 'Kino VOD', title: 'Kino Chrześcijańskie VOD', link: 'https://polskieradio.cc/vod' }
    ];

    const audioNode = document.getElementById('audio-live-engine');
    let currentStationIndex = 0;
    let isLivePlaying = false;
    let isMutedState = false;
    let previousVolume = 0.85;

    let activeSlideIndex = 0;
    let activeOfferIndex = 0;
    const TOTAL_SLIDES = 4;
    let carouselTimer = null;
    let isCarouselSuspended = false;

    function toggleAudioStreaming() {
      const station = RADIO_STATIONS[currentStationIndex];
      if (!audioNode.src || !audioNode.src.includes('stream')) {
        audioNode.src = station.streamUrl;
      }
      if (isLivePlaying) {
        audioNode.pause();
        updatePlaybackUi(false);
      } else {
        document.getElementById('rds-active-title').textContent = `Łączenie: ${station.name}...`;
        audioNode.play().then(() => updatePlaybackUi(true)).catch(() => updatePlaybackUi(true));
      }
    }

    function updatePlaybackUi(isPlaying) {
      isLivePlaying = isPlaying;
      const playIcon = document.getElementById('icon-play-state');
      const pauseIcon = document.getElementById('icon-pause-state');
      const eq = document.getElementById('sacred-audio-eq');
      const station = RADIO_STATIONS[currentStationIndex];

      if (isPlaying) {
        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
        eq.classList.add('is-playing');
        document.getElementById('rds-active-title').textContent = `Odtwarzanie: ${station.name}`;
      } else {
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
        eq.classList.remove('is-playing');
        document.getElementById('rds-active-title').textContent = `Wstrzymano: ${station.name}`;
      }
    }

    function changeStationOffset(offset) {
      currentStationIndex = (currentStationIndex + offset + RADIO_STATIONS.length) % RADIO_STATIONS.length;
      applyStation();
    }

    function selectDirectStation(id) {
      const idx = RADIO_STATIONS.findIndex(s => s.id === id);
      if (idx !== -1) {
        currentStationIndex = idx;
        applyStation();
      }
    }

    function applyStation() {
      const station = RADIO_STATIONS[currentStationIndex];
      document.getElementById('rds-active-title').textContent = isLivePlaying ? `Odtwarzanie: ${station.name}` : `Wybrano: ${station.name}`;
      document.getElementById('rds-active-subtitle').textContent = station.caption;
      document.getElementById('active-station-badge').textContent = station.name.toUpperCase();

      ['prcc', 'cc', 'biblia'].forEach(id => {
        const btn = document.getElementById(`channel-btn-${id}`);
        if (!btn) return;
        if (id === station.id) {
          btn.className = "py-1 px-1 rounded-md text-[10px] font-bold text-center truncate bg-[#c5a059] text-black";
        } else {
          btn.className = "py-1 px-1 rounded-md text-[10px] font-bold text-center truncate bg-[#131722] text-[#7e8a9f] hover:text-white border border-[#232b3b]";
        }
      });

      const wasPlaying = isLivePlaying;
      audioNode.src = station.streamUrl;
      if (wasPlaying) {
        audioNode.play().then(() => updatePlaybackUi(true)).catch(() => updatePlaybackUi(false));
      }
    }

    function changeMasterVolume(val) {
      audioNode.volume = parseFloat(val);
      previousVolume = audioNode.volume;
      setMuteIcon(previousVolume === 0);
    }

    function toggleVolumeMute() {
      isMutedState = !isMutedState;
      audioNode.muted = isMutedState;
      setMuteIcon(isMutedState);
      document.getElementById('master-volume-fader').value = isMutedState ? 0 : previousVolume;
    }

    function setMuteIcon(muted) {
      const activeIcon = document.getElementById('vol-active-icon');
      const mutedIcon = document.getElementById('vol-muted-icon');
      if (muted) {
        activeIcon.classList.add('hidden');
        mutedIcon.classList.remove('hidden');
      } else {
        activeIcon.classList.remove('hidden');
        mutedIcon.classList.add('hidden');
      }
    }

    function displayTargetSlide(idx) {
      activeSlideIndex = idx;
      if (idx === 2) {
        activeOfferIndex = (activeOfferIndex + 1) % ECOSYSTEM_SERVICES.length;
        const offer = ECOSYSTEM_SERVICES[activeOfferIndex];
        document.getElementById('promo-category-badge').textContent = offer.catLabel.toUpperCase();
        document.getElementById('promo-offer-headline').textContent = offer.title;
        document.getElementById('promo-external-link').href = offer.link;
      }

      for (let i = 0; i < TOTAL_SLIDES; i++) {
        const slide = document.getElementById(`slide-item-${i}`);
        const dot = document.getElementById(`dot-indicator-${i}`);
        if (i === activeSlideIndex) {
          slide.classList.remove('opacity-0', 'scale-[0.98]', 'pointer-events-none');
          slide.classList.add('opacity-100', 'scale-100', 'pointer-events-auto');
          dot.className = "w-1.5 h-1.5 rounded-full bg-[#c5a059] shadow-[0_0_4px_#f5dd8c]";
        } else {
          slide.classList.remove('opacity-100', 'scale-100', 'pointer-events-auto');
          slide.classList.add('opacity-0', 'scale-[0.98]', 'pointer-events-none');
          dot.className = "w-1.5 h-1.5 rounded-full bg-[#1e2534]";
        }
      }
    }

    function pauseCarousel() { isCarouselSuspended = true; }
    function resumeCarousel() { isCarouselSuspended = false; }

    window.onload = function() {
      const params = new URLSearchParams(window.location.search);
      const ch = params.get('channel');
      if (ch === 'cc') currentStationIndex = 1;
      else if (ch === 'biblia') currentStationIndex = 2;
      else currentStationIndex = 0;

      audioNode.volume = previousVolume;
      audioNode.src = RADIO_STATIONS[currentStationIndex].streamUrl;
      applyStation();
      displayTargetSlide(0);

      carouselTimer = setInterval(() => {
        if (!isCarouselSuspended) {
          displayTargetSlide((activeSlideIndex + 1) % TOTAL_SLIDES);
        }
      }, 6000);

      if (params.get('autoplay') === '1') {
        toggleAudioStreaming();
      }
    };
  </script>
</body>
</html>
