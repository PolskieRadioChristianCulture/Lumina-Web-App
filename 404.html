<!DOCTYPE html>
<html lang="pl">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y4EFTVBPE3"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-Y4EFTVBPE3');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona nie została znaleziona (404) | Christian Culture</title>
    <link rel="icon" href="Logo Biblia Audio CC.jpg" type="image/jpeg">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --dark-bg: #05070b;
            --glass-bg: rgba(10, 14, 23, 0.88);
            --glass-border: rgba(212, 175, 55, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--dark-bg);
            background-image: radial-gradient(circle at 50% 30%, rgba(212, 175, 55, 0.12) 0%, rgba(5, 7, 11, 0.98) 70%);
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .error-card {
            background: var(--glass-bg);
            border: 1.5px solid var(--glass-border);
            border-radius: 24px;
            padding: 45px 35px;
            max-width: 550px;
            width: 100%;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 15px 45px rgba(0,0,0,0.8), 0 0 35px rgba(212, 175, 55, 0.15);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-code {
            font-family: 'Cinzel', serif;
            font-size: 5rem;
            font-weight: 900;
            color: var(--gold-primary);
            line-height: 1;
            margin-bottom: 10px;
            text-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
        }

        .error-title {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 15px;
        }

        .error-desc {
            font-size: 1rem;
            color: #a1a1aa;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--gold-primary);
            color: #000;
            font-weight: 800;
            font-size: 1rem;
            padding: 14px 32px;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
            transition: all 0.3s ease;
        }

        .btn-home:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.7);
        }

        .countdown-text {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #71717a;
        }
    </style>
</head>
<body>

    <div class="error-card">
        <div class="error-code">404</div>
        <h1 class="error-title">STRONA NIE ZOSTAŁA ODNALEZIONA</h1>
        <p class="error-desc">
            Adres, którego szukasz, nie istnieje lub został przeniesiony pod nową lokalizację w ekosystemie Christian Culture.
        </p>
        <a href="index.html" class="btn-home">
            <i class="fa-solid fa-house"></i> POWRÓT DO STRONY GŁÓWNEJ
        </a>
        <p class="countdown-text" id="countdownText">Automatyczne przekierowanie za <span id="sec">5</span> s...</p>
    </div>

    <script>
        let seconds = 5;
        const secEl = document.getElementById('sec');
        const timer = setInterval(() => {
            seconds--;
            if (secEl) secEl.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = 'index.html';
            }
        }, 1000);
    </script>
</body>
</html>
