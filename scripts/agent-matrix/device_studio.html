<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>MATRIX CC — Wielourządzeniowy Symulator Smartfonów & Centrum Automatyzacji</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #050811;
      --bg-surface: #0b1329;
      --bg-card: rgba(18, 28, 56, 0.75);
      --gold-primary: #d4af37;
      --gold-glow: rgba(212, 175, 55, 0.45);
      --purple-accent: #7c3aed;
      --purple-glow: rgba(124, 58, 237, 0.4);
      --cyan-accent: #06b6d4;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.12);
      
      /* Phone Dimensions */
      --phone-w: 380px;
      --phone-h: 760px;
      --phone-radius: 46px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Zablokuj zaznaczanie tekstu tylko na elementach UI, nie na inputach */
    body, button, select, label {
      user-select: none;
    }

    input, textarea {
      user-select: text;
      -webkit-user-select: text;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #070a14 50%, #030712 100%);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: auto;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER / MATRIX CC CONTROL BAR ── */
    .matrix-header {
      background: rgba(11, 19, 41, 0.92);
      backdrop-filter: blur(25px);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.6);
      flex-wrap: wrap;
      gap: 12px;
    }

    .matrix-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px var(--purple-glow);
      font-size: 22px;
      color: #fff;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #ffffff 30%, #d4af37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    /* Toolbar Actions */
    .matrix-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-action {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--gold-primary);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(212, 175, 55, 0.25);
    }

    .btn-add-phone {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      font-weight: 700;
      border: 1px solid #34d399;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.35);
    }

    .btn-add-phone:hover {
      background: linear-gradient(135deg, #34d399, #10b981);
      box-shadow: 0 0 24px rgba(16, 185, 129, 0.5);
    }

    .btn-gold {
      background: linear-gradient(135deg, #d4af37, #b8860b);
      color: #000;
      font-weight: 700;
      border: none;
    }

    .btn-gold:hover {
      background: linear-gradient(135deg, #fef08a, #d4af37);
      box-shadow: 0 0 20px var(--gold-glow);
    }

    .btn-logout-all {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      color: #fff;
      font-weight: 700;
      border: 1px solid #ef4444;
      box-shadow: 0 0 14px rgba(220, 38, 38, 0.3);
    }

    .btn-logout-all:hover {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
    }

    .layout-switcher {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      gap: 4px;
    }

    .layout-btn {
      padding: 6px 12px;
      font-size: 0.78rem;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .layout-btn.active {
      background: #7c3aed;
      color: #fff;
      box-shadow: 0 0 12px var(--purple-glow);
    }

    .server-switcher {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      gap: 4px;
    }

    .server-btn {
      padding: 6px 12px;
      font-size: 0.78rem;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .server-btn.active {
      background: #0ea5e9;
      color: #fff;
      box-shadow: 0 0 12px rgba(14, 165, 233, 0.4);
    }

    .zoom-ctrl {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      font-size: 0.8rem;
    }

    .zoom-ctrl input {
      width: 90px;
      accent-color: var(--gold-primary);
      cursor: pointer;
    }

    /* ── MAIN STUDIO CANVAS ── */
    .studio-canvas {
      flex: 1;
      padding: 26px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: auto;
      min-width: 100%;
    }

    .phones-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
      width: 100%;
      max-width: 100%;
      justify-content: center;
      transform-origin: top center;
      transition: transform 0.25s ease, gap 0.25s ease;
    }

    /* When in Panorama 1-Row mode (or zoom <= 50%) */
    .phones-grid.mode-row {
      display: flex !important;
      flex-direction: row !important;
      flex-wrap: nowrap !important;
      gap: 16px !important;
      width: max-content !important;
      justify-content: center !important;
    }

    /* ── INDIVIDUAL PHONE CARD SUITE ── */
    .phone-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      width: calc(var(--phone-w) + 32px);
      flex-shrink: 0;
    }

    .phone-unit:hover {
      border-color: rgba(212, 175, 55, 0.4);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), 0 0 25px rgba(124, 58, 237, 0.2);
    }

    /* Phone Unit Header (Selector & Title) */
    .phone-unit-header {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .phone-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .phone-id-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--gold-primary);
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.3);
      padding: 4px 10px;
      border-radius: 8px;
    }

    .phone-header-actions {
      display: flex;
      gap: 6px;
    }

    .btn-tiny {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      transition: all 0.2s;
    }

    .btn-tiny:hover {
      color: #fff;
      border-color: var(--gold-primary);
      background: rgba(255,255,255,0.1);
    }

    .btn-tiny.delete:hover {
      background: #ef4444;
      border-color: #f87171;
      color: #fff;
    }

    /* Profile Selector Dropdown */
    .profile-select-wrap {
      width: 100%;
      display: flex;
      gap: 6px;
    }

    .select-profile {
      flex: 1;
      background: #090d1a;
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: #f8fafc;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .select-profile option {
      background: #0b1329;
      color: #fff;
      padding: 6px;
    }

    /* ── REALISTIC PHONE HARDWARE CHASSIS ── */
    .phone-device {
      width: var(--phone-w);
      height: var(--phone-h);
      background: #020617;
      border-radius: var(--phone-radius);
      position: relative;
      box-shadow: 
        0 0 0 3px #64748b,
        0 0 0 6px #1e293b,
        0 20px 45px -10px rgba(0, 0, 0, 0.8),
        0 0 30px rgba(124, 58, 237, 0.15);
      border: 5px solid #0f172a;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Notch / Dynamic Island */
    .phone-notch {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 105px;
      height: 26px;
      background: #000;
      border-radius: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    }

    .camera-lens {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #475569, #000);
      border: 1px solid #1e293b;
    }

    .sensor-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #0f172a;
    }

    /* Status Bar */
    .phone-status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 42px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      font-weight: 700;
      color: #fff;
      z-index: 90;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.68rem;
    }

    /* Screen Viewport */
    .phone-screen {
      width: 100%;
      height: 100%;
      border: none;
      background: #090d1a;
      border-radius: calc(var(--phone-radius) - 5px);
      overflow: hidden;
      position: relative;
    }

    .phone-screen iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Home Bar */
    .phone-home-bar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 4px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 10px;
      z-index: 100;
      pointer-events: none;
    }

    /* ── CONTROLS & AUTOMATION FOOTER PER PHONE ── */
    .phone-unit-footer {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Custom URL Address Bar */
    .url-bar-wrap {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #050a17;
      border: 1px solid rgba(14, 165, 233, 0.4);
      border-radius: 10px;
      padding: 4px 8px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
    }

    .url-input-field {
      flex: 1;
      background: transparent;
      border: none;
      color: #38bdf8;
      font-family: monospace;
      font-size: 0.78rem;
      outline: none;
      padding: 4px;
      user-select: text;
    }

    .url-input-field::placeholder {
      color: #64748b;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .btn-url-action {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.1);
      color: #e2e8f0;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      transition: all 0.2s;
    }

    .btn-url-action:hover {
      background: #0ea5e9;
      color: #fff;
    }

    .btn-url-action.go:hover {
      background: #22c55e;
      color: #000;
    }

    .auth-bar {
      display: flex;
      gap: 6px;
    }

    .btn-auth-google {
      flex: 1;
      background: linear-gradient(135deg, #ea4335, #db4437);
      color: #fff;
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-auth-google:hover {
      filter: brightness(1.1);
      box-shadow: 0 0 12px rgba(234, 67, 53, 0.4);
    }

    .btn-quick-nav {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .btn-quick-nav:hover {
      border-color: var(--gold-primary);
    }

    /* Automation Box */
    .automation-box {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(124, 58, 237, 0.3);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .auto-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
    }

    .auto-label {
      color: #c084fc;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .auto-toggle-btn {
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .auto-toggle-btn.active {
      background: #22c55e;
      color: #000;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
    }

    .auto-toggle-btn.inactive {
      background: #475569;
      color: #cbd5e1;
    }

    .select-auto {
      width: 100%;
      background: #0b1329;
      border: 1px solid var(--border-color);
      color: #e2e8f0;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      outline: none;
    }

    .auto-status-msg {
      font-size: 0.7rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* ── FOOTER STATUS BAR ── */
    .matrix-console {
      background: rgba(11, 19, 41, 0.96);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-color);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      bottom: 0;
      z-index: 1000;
      font-size: 0.8rem;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulseAnim 1.5s infinite;
      display: inline-block;
    }

    @keyframes pulseAnim {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.6); opacity: 0.3; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- MATRIX CC HEADER -->
  <header class="matrix-header">
    <div class="matrix-brand">
      <div class="brand-logo">
        <i class="fa-solid fa-cross"></i>
      </div>
      <div>
        <div class="brand-title">MATRIX CC — VIRTUAL PHONE SUITE</div>
        <div class="brand-subtitle">Niezależny Symulator Smartfonów & Centrum Zautomatyzowanej Misji</div>
      </div>
    </div>

    <div class="matrix-toolbar">
      <button class="btn-action btn-add-phone" onclick="addNewPhone()">
        <i class="fa-solid fa-circle-plus"></i> Dodaj Telefon (+)
      </button>

      <button class="btn-action btn-gold" onclick="sendGlobalBlessing()">
        <i class="fa-solid fa-dove"></i> Błogosławieństwo
      </button>

      <div class="layout-switcher">
        <button class="layout-btn" id="btnLayoutRow" onclick="setLayoutMode('row')">
          <i class="fa-solid fa-grip-lines"></i> 1 Rząd (Panorama)
        </button>
        <button class="layout-btn active" id="btnLayoutAuto" onclick="setLayoutMode('auto')">
          <i class="fa-solid fa-table-cells"></i> Siatka / Auto
        </button>
      </div>

      <button class="btn-action" onclick="toggleAllAutomations()">
        <i class="fa-solid fa-robot"></i> Automatyzacje
      </button>

      <button class="btn-action btn-logout-all" onclick="logoutFromAll()" title="Wyloguj wszystkie wirtualne telefony z kont i sesji">
        <i class="fa-solid fa-right-from-bracket"></i> Wyloguj ze Wszystkich
      </button>

      <button class="btn-action" onclick="reloadAll()">
        <i class="fa-solid fa-rotate"></i> Odśwież
      </button>

      <div class="server-switcher">
        <button class="server-btn active" id="srvProd" onclick="setServer('prod')">Produkcja</button>
        <button class="server-btn" id="srvLocal" onclick="setServer('local')">Lokalny</button>
      </div>

      <div class="zoom-ctrl">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="range" id="zoomSlider" min="30" max="100" value="40" oninput="applyZoom(this.value)">
        <span id="zoomVal">40%</span>
      </div>
    </div>
  </header>

  <!-- MAIN CANVAS WITH DYNAMIC VIRTUAL PHONES -->
  <main class="studio-canvas">
    <div class="phones-grid mode-row" id="phonesGrid">
      <!-- Virtual Phone Units dynamically rendered here -->
    </div>
  </main>

  <!-- CONSOLE STATUS FOOTER -->
  <footer class="matrix-console">
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="pulse-dot"></span>
      <span id="matrixStatus">MATRIX CC gotowy. Wszystkie wirtualne telefony działają w niezależnych sesjach.</span>
    </div>
    <div style="color: var(--gold-primary); font-weight: 700;">
      <i class="fa-solid fa-shield-halved"></i> Ekosystem Christian Culture • Panel Dowódcy Nazira
    </div>
  </footer>

  <script>
    // PROFILE CATALOG
    const PROFILE_OPTIONS = [

      { id: "ccmen", label: "⚔️ Mężczyźni CC (Wspólnota Mężczyzn)", path: "/lumina.ccmen", avatar: "avatar_ccmen.jpg" },
      { id: "ccwomen", label: "🌺 Kobiety CC (Wspólnota Kobiet)", path: "/lumina.ccwomen", avatar: "avatar_ccwomen.jpg" },

      { id: "studiodobregoslowa", label: "🎙️ Studio Dobrego Słowa", path: "/lumina.studiodobregoslowa", avatar: "lumina-icon-192.png" },
      { id: "cctv", label: "📺 CCTV24 CC (Kanał TV)", path: "/lumina.cctv", avatar: "lumina-icon-192.png" },
      { id: "osobowoscplus", label: "🌟 Osobowość Plus", path: "/lumina.osobowoscplus", avatar: "lumina-icon-192.png" },
      { id: "tablica", label: "📰 Tablica Społeczności LUMINA", path: "/tablica", avatar: "lumina-icon-192.png" },
      { id: "lumina", label: "✨ Portal Główny & Randki LUMINA", path: "/lumina", avatar: "lumina-icon-192.png" },
      { id: "login", label: "🔑 Panel Logowania Google / Email", path: "/lumina-login.html", avatar: "lumina-icon-192.png" },
      { id: "modlitwa", label: "✝️ Ściana Modlitwy (Zjednoczeni za Polskę)", path: "/modlitwa.html", avatar: "lumina-icon-192.png" },
      { id: "worship", label: "🎵 CCTV24 Worship Live TV", path: "/cctv24-worship.html", avatar: "lumina-icon-192.png" },
      { id: "custom", label: "🌐 Własny adres URL (Wpisz / Wklej poniżej)", path: "", avatar: "lumina-icon-192.png" }
    ];

    // AUTOMATION PRESETS
    const AUTOMATION_OPTIONS = [
      { id: "none", label: "🎮 Sterowanie ręczne (Brak automatu)" },
      { id: "blessings", label: "✨ Smart Blessings (Automatyczne Błogosławieństwa)" },
      { id: "prayer", label: "🙏 Czuwanie i Modlitwa Wstawiennicza" },
      { id: "board_curator", label: "📰 Przeglądanie i Polubienia Tablicy" },
      { id: "radio_listener", label: "📻 Odsłuch Worship & Radio CC" },
      { id: "story_creator", label: "📜 Eksploracja Kart Słowa 9:16" }
    ];

    let currentServer = 'prod'; // 'prod' or 'local'
    let currentLayoutMode = 'auto'; // 'auto' or 'row'
    const PROD_BASE = 'https://polskieradio.cc';
    const LOCAL_BASE = 'http://localhost:3000';

    // State of all active phones
    let phones = [];

    // Load State from LocalStorage
    function loadSavedState() {
      try {
        const saved = localStorage.getItem('matrix_cc_phones_v2');
        if (saved) {
          phones = JSON.parse(saved);
        }
      } catch (e) {
        console.warn('Błąd odczytu zapisanych telefonów:', e);
      }

      // Default starter 7 phones if empty
      if (!phones || phones.length === 0) {
        phones = [
          { id: 1, profileId: "cezary", autoId: "none", autoActive: false, deviceTime: "11:35", customUrl: "" },
          { id: 2, profileId: "wioletta", autoId: "none", autoActive: false, deviceTime: "11:35", customUrl: "" },
          { id: 3, profileId: "jola", autoId: "blessings", autoActive: true, deviceTime: "11:35", customUrl: "" },
          { id: 4, profileId: "andrzej", autoId: "radio_listener", autoActive: true, deviceTime: "11:35", customUrl: "" },
          { id: 5, profileId: "magdalena", autoId: "prayer", autoActive: true, deviceTime: "11:35", customUrl: "" },
          { id: 6, profileId: "ccmen", autoId: "board_curator", autoActive: true, deviceTime: "11:35", customUrl: "" },
          { id: 7, profileId: "ccwomen", autoId: "story_creator", autoActive: true, deviceTime: "11:35", customUrl: "" }
        ];
      }
    }

    function saveState() {
      try {
        localStorage.setItem('matrix_cc_phones_v2', JSON.stringify(phones));
      } catch (e) {}
    }

    function getBaseUrl() {
      return currentServer === 'local' ? LOCAL_BASE : PROD_BASE;
    }

    function getPhoneUrl(phone) {
      if (phone.customUrl && phone.customUrl.trim() !== '') {
        return normalizeUrl(phone.customUrl);
      }
      const p = PROFILE_OPTIONS.find(x => x.id === phone.profileId) || PROFILE_OPTIONS[0];
      return `${getBaseUrl()}${p.path}`;
    }

    function normalizeUrl(input) {
      let raw = input.trim();
      if (!raw) return `${getBaseUrl()}/lumina`;

      let decoded = raw;
      try { decoded = decodeURIComponent(raw); } catch (e) {}

      // Rozpoznaj bezpośredni @handle (wpisany bez youtube.com)
      if (/^@[a-zA-Z0-9_\u0080-\uFFFF.-]+$/.test(decoded)) {
        return `yt_embed_viewer.html?channel=${encodeURIComponent(decoded)}`;
      }

      // YouTube — dowolny film, kanal lub shorts
      if (decoded.includes('youtube.com') || decoded.includes('youtu.be')) {

        // 1. Shorts
        const shortsMatch = decoded.match(/youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/i);
        if (shortsMatch && shortsMatch[1]) {
          return `yt_embed_viewer.html?v=${shortsMatch[1]}&type=shorts`;
        }

        // 2. Konkretny film (watch?v= lub youtu.be/)
        const videoMatch = decoded.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|v\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/i);
        if (videoMatch && videoMatch[1]) {
          return `yt_embed_viewer.html?v=${videoMatch[1]}`;
        }

        // 3. Playlista (?list=PLxxxx)
        const playlistMatch = decoded.match(/[?&]list=([a-zA-Z0-9_-]+)/i);
        if (playlistMatch && playlistMatch[1]) {
          return `yt_embed_viewer.html?list=${playlistMatch[1]}`;
        }

        // 4. Kanał po @handle
        const handleMatch = decoded.match(/@([a-zA-Z0-9_\u0080-\uFFFF.-]+)/);
        if (handleMatch && handleMatch[0]) {
          return `yt_embed_viewer.html?channel=${encodeURIComponent(handleMatch[0])}`;
        }

        // 5. Wyszukiwanie / inne URL YouTube
        const qParam = decoded.match(/[?&](?:q|search_query)=([^&]+)/i);
        if (qParam && qParam[1]) {
          return `yt_embed_viewer.html?q=${qParam[1]}`;
        }

        // Fallback — zaladuj w viewerze z pelnym URL
        return `yt_embed_viewer.html?q=${encodeURIComponent(decoded)}`;
      }

      if (raw.startsWith('/')) return `${getBaseUrl()}${raw}`;
      if (!/^https?:\/\//i.test(raw)) {
        raw = 'https://' + raw;
      }
      return raw;
    }

    // Render All Phone Units
    function renderGrid() {
      const grid = document.getElementById('phonesGrid');
      grid.innerHTML = '';

      phones.forEach((phone, index) => {
        const selectedProf = PROFILE_OPTIONS.find(p => p.id === phone.profileId) || PROFILE_OPTIONS[0];
        const selectedAuto = AUTOMATION_OPTIONS.find(a => a.id === phone.autoId) || AUTOMATION_OPTIONS[0];
        const targetUrl = getPhoneUrl(phone);

        const card = document.createElement('div');
        card.className = 'phone-unit';
        card.id = `unit-${phone.id}`;

        card.innerHTML = `
          <!-- PHONE HEADER (Profile Switcher & Actions) -->
          <div class="phone-unit-header">
            <div class="phone-header-top">
              <div class="phone-id-badge">
                <i class="fa-solid fa-mobile-screen-button"></i> Telefon #${index + 1}
              </div>
              <div class="phone-header-actions">
                <button class="btn-tiny" title="Odśwież ten telefon" onclick="reloadPhone(${phone.id})">
                  <i class="fa-solid fa-rotate-right"></i>
                </button>
                <button class="btn-tiny" title="Otwórz w osobnym oknie" onclick="openWindow('${targetUrl}')">
                  <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </button>
                <button class="btn-tiny delete" title="Usuń ten telefon" onclick="deletePhone(${phone.id})">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </div>

            <!-- Profile Selector Dropdown -->
            <div class="profile-select-wrap">
              <select class="select-profile" onchange="changePhoneProfile(${phone.id}, this.value)">
                ${PROFILE_OPTIONS.map(opt => `
                  <option value="${opt.id}" ${opt.id === phone.profileId ? 'selected' : ''}>
                    ${opt.label}
                  </option>
                `).join('')}
              </select>
            </div>
          </div>

          <!-- PHYSICAL PHONE CHASSIS -->
          <div class="phone-device" id="device-${phone.id}">
            <!-- Dynamic Island -->
            <div class="phone-notch">
              <div class="sensor-dot"></div>
              <div class="camera-lens"></div>
            </div>

            <!-- Status Bar -->
            <div class="phone-status-bar">
              <span>${phone.deviceTime || '11:35'}</span>
              <div class="status-icons">
                <i class="fa-solid fa-signal"></i>
                <span>5G</span>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
              </div>
            </div>

            <!-- Interactive Screen (Iframe) -->
            <div class="phone-screen">
              <iframe id="iframe-${phone.id}" src="${targetUrl}" allow="camera; microphone; geolocation"></iframe>
            </div>

            <!-- Home Bar -->
            <div class="phone-home-bar"></div>
          </div>

          <!-- CONTROLS & AUTOMATION FOOTER -->
          <div class="phone-unit-footer">
            <!-- Custom URL Address Bar (Input / Paste / Go) -->
            <div class="url-bar-wrap">
              <i class="fa-solid fa-globe" style="color:#38bdf8; font-size:0.75rem; margin-left:2px;"></i>
              <input type="text" 
                     id="url-input-${phone.id}" 
                     class="url-input-field" 
                     placeholder="Wklej https://... lub www..." 
                     value="${phone.customUrl || targetUrl}"
                     onkeydown="if(event.key==='Enter') loadCustomUrl(${phone.id})">
              <button class="btn-url-action go" title="Załaduj stronę (Enter)" onclick="loadCustomUrl(${phone.id})">
                <i class="fa-solid fa-arrow-right"></i>
              </button>
              <button class="btn-url-action" title="Wklej ze schowka i załaduj" onclick="pasteAndLoadUrl(${phone.id})">
                <i class="fa-solid fa-paste"></i>
              </button>
            </div>

            <div class="auth-bar">
              <button class="btn-auth-google" onclick="loginWithGoogle(${phone.id})">
                <i class="fa-brands fa-google"></i> Zaloguj z Google
              </button>
              <button class="btn-quick-nav" title="Strona Główna / Portal" onclick="navigatePhone(${phone.id}, '/lumina')">
                <i class="fa-solid fa-house"></i>
              </button>
              <button class="btn-quick-nav" title="Tablica" onclick="navigatePhone(${phone.id}, '/tablica')">
                <i class="fa-solid fa-newspaper"></i>
              </button>
            </div>

            <!-- Automation Box -->
            <div class="automation-box">
              <div class="auto-top">
                <div class="auto-label">
                  <i class="fa-solid fa-brain"></i> Dedykowana Automatyzacja:
                </div>
                <button class="auto-toggle-btn ${phone.autoActive ? 'active' : 'inactive'}" onclick="togglePhoneAuto(${phone.id})">
                  ${phone.autoActive ? 'AKTYWNY' : 'WYŁĄCZONY'}
                </button>
              </div>

              <select class="select-auto" onchange="changePhoneAuto(${phone.id}, this.value)">
                ${AUTOMATION_OPTIONS.map(opt => `
                  <option value="${opt.id}" ${opt.id === phone.autoId ? 'selected' : ''}>
                    ${opt.label}
                  </option>
                `).join('')}
              </select>

              <div class="auto-status-msg" id="auto-status-${phone.id}">
                <i class="fa-solid fa-circle-info"></i> ${phone.autoActive ? 'Robot wykonuje zaplanowane zadania misyjne.' : 'Gotowy do pracy manualnej.'}
              </div>
            </div>
          </div>
        `;

        grid.appendChild(card);
      });

      document.getElementById('matrixStatus').innerText = `Aktywne wirtualne telefony: ${phones.length} szt. Wszystkie gotowe do pracy.`;
    }

    // Load Custom URL entered in input field
    function loadCustomUrl(id) {
      const input = document.getElementById(`url-input-${id}`);
      if (!input) return;
      const rawVal = input.value.trim();
      if (!rawVal) return;

      const normalized = normalizeUrl(rawVal);
      // Nie nadpisuj wartości input — zostaw to co użytkownik wpisał

      const phone = phones.find(p => p.id === id);
      if (phone) {
        phone.customUrl = rawVal;   // Zapamiętaj oryginalny wpisany URL
        phone.profileId = "custom";
        saveState();
      }

      const iframe = document.getElementById(`iframe-${id}`);
      if (iframe) {
        iframe.src = normalized;
      }
      input.blur(); // Schowaj klawiaturę
      const idx = phones.findIndex(p => p.id === id) + 1;
      document.getElementById('matrixStatus').innerText = `📱 Telefon #${idx}: Ładuję ${rawVal}`;
    }

    // Paste from Clipboard and Load
    async function pasteAndLoadUrl(id) {
      try {
        const text = await navigator.clipboard.readText();
        if (text && text.trim()) {
          const input = document.getElementById(`url-input-${id}`);
          if (input) {
            input.value = text.trim();
            loadCustomUrl(id);
          }
        }
      } catch (err) {
        // Fallback prompt if clipboard API blocked
        const pasted = prompt("Wklej adres URL (https://... lub www...):");
        if (pasted && pasted.trim()) {
          const input = document.getElementById(`url-input-${id}`);
          if (input) {
            input.value = pasted.trim();
            loadCustomUrl(id);
          }
        }
      }
    }

    // Add New Phone
    function addNewPhone() {
      const newId = Date.now();
      phones.push({
        id: newId,
        profileId: "lumina",
        autoId: "none",
        autoActive: false,
        deviceTime: "11:35",
        customUrl: ""
      });
      saveState();
      renderGrid();
      document.getElementById('matrixStatus').innerText = `Dodano nowy telefon #${phones.length}. Wybierz dla niego profil lub wpisz adres URL.`;
    }

    // Delete Phone
    function deletePhone(id) {
      if (phones.length <= 1) {
        alert("Musi pozostać co najmniej jeden wirtualny telefon.");
        return;
      }
      phones = phones.filter(p => p.id !== id);
      saveState();
      renderGrid();
    }

    // Change Profile
    function changePhoneProfile(id, newProfileId) {
      const phone = phones.find(p => p.id === id);
      if (phone) {
        phone.profileId = newProfileId;
        if (newProfileId !== 'custom') {
          phone.customUrl = '';
        }
        saveState();
        const iframe = document.getElementById(`iframe-${id}`);
        const input = document.getElementById(`url-input-${id}`);
        const newUrl = getPhoneUrl(phone);
        if (iframe) iframe.src = newUrl;
        if (input) input.value = newUrl;
      }
    }

    // Change Automation
    function changePhoneAuto(id, newAutoId) {
      const phone = phones.find(p => p.id === id);
      if (phone) {
        phone.autoId = newAutoId;
        saveState();
      }
    }

    // Toggle Automation
    function togglePhoneAuto(id) {
      const phone = phones.find(p => p.id === id);
      if (phone) {
        phone.autoActive = !phone.autoActive;
        saveState();
        renderGrid();
      }
    }

    // Toggle All Automations
    function toggleAllAutomations() {
      const anyActive = phones.some(p => p.autoActive);
      phones.forEach(p => p.autoActive = !anyActive);
      saveState();
      renderGrid();
      document.getElementById('matrixStatus').innerText = anyActive ? "Wyłączono wszystkie automatyzacje." : "Uruchomiono wszystkie automatyzacje!";
    }

    // Google Login Action
    function loginWithGoogle(id) {
      const loginUrl = `${getBaseUrl()}/lumina-login.html`;
      const iframe = document.getElementById(`iframe-${id}`);
      const input = document.getElementById(`url-input-${id}`);
      if (iframe) iframe.src = loginUrl;
      if (input) input.value = loginUrl;
    }

    // Quick Navigate
    function navigatePhone(id, path) {
      const fullUrl = `${getBaseUrl()}${path}`;
      const iframe = document.getElementById(`iframe-${id}`);
      const input = document.getElementById(`url-input-${id}`);
      if (iframe) iframe.src = fullUrl;
      if (input) input.value = fullUrl;
    }

    // Reload Phone
    function reloadPhone(id) {
      const iframe = document.getElementById(`iframe-${id}`);
      if (iframe) iframe.src = iframe.src;
    }

    // Reload All
    function reloadAll() {
      phones.forEach(p => reloadPhone(p.id));
      document.getElementById('matrixStatus').innerText = "Odświeżono wszystkie ekrany telefonów.";
    }

    // Open Window
    function openWindow(url) {
      window.open(url, '_blank', 'width=420,height=860');
    }

    // Global Blessing
    function sendGlobalBlessing() {
      alert("🕊️ Wysłano impuls Bożego Błogosławieństwa Czasu Rzeczywistego do wszystkich wirtualnych telefonów w Matrix CC!");
      document.getElementById('matrixStatus').innerText = "✨ Wysłano impuls błogosławieństwa biblijnego do wszystkich aktywnych telefonów.";
    }

    // Logout From All Virtual Phones
    function logoutFromAll() {
      if (!confirm("Czy na pewno chcesz wylogować wszystkie wirtualne telefony i zresetować aktywne sesje?")) {
        return;
      }

      phones.forEach(phone => {
        const iframe = document.getElementById(`iframe-${phone.id}`);
        const input = document.getElementById(`url-input-${phone.id}`);
        const logoutUrl = `${getBaseUrl()}/lumina-login.html?logout=true&ts=${Date.now()}`;
        
        try {
          if (iframe && iframe.contentWindow) {
            iframe.contentWindow.postMessage({ type: 'LUMINA_FORCE_LOGOUT' }, '*');
          }
        } catch (e) {}

        if (iframe) iframe.src = logoutUrl;
        if (input) input.value = `${getBaseUrl()}/lumina-login.html`;
        phone.profileId = "login";
        phone.customUrl = "";
      });

      saveState();
      document.getElementById('matrixStatus').innerText = "🚪 Pomyślnie wylogowano wszystkie telefony. Sesje zostały zresetowane.";
      alert("✅ Pomyślnie wylogowano ze wszystkich wirtualnych telefonów!");
    }

    // Server Switcher
    function setServer(srv) {
      currentServer = srv;
      document.getElementById('srvProd').className = 'server-btn ' + (srv === 'prod' ? 'active' : '');
      document.getElementById('srvLocal').className = 'server-btn ' + (srv === 'local' ? 'active' : '');
      reloadAll();
    }

    // Layout Switcher
    function setLayoutMode(mode) {
      currentLayoutMode = mode;
      document.getElementById('btnLayoutRow').className = 'layout-btn ' + (mode === 'row' ? 'active' : '');
      document.getElementById('btnLayoutAuto').className = 'layout-btn ' + (mode === 'auto' ? 'active' : '');
      applyZoom(document.getElementById('zoomSlider').value);
    }

    // Zoom
    function applyZoom(val) {
      document.getElementById('zoomVal').innerText = val + '%';
      const scale = val / 100;
      const grid = document.getElementById('phonesGrid');
      grid.style.transform = `scale(${scale})`;

      // Przy skali <= 50% lub przy aktywnym trybie "row" telefony ustawiają się w 1 poziomym rzędzie
      if (val <= 50 || currentLayoutMode === 'row') {
        grid.classList.add('mode-row');
      } else {
        grid.classList.remove('mode-row');
      }
    }

    // Init
    loadSavedState();
    renderGrid();
    applyZoom(40);
  </script>
