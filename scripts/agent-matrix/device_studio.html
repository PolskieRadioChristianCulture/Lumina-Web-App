<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>LUMINA Mobile Studio — Wielourządzeniowy Symulator Telefonów</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #070a14;
      --bg-surface: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.7);
      --gold-primary: #d4af37;
      --gold-glow: rgba(212, 175, 55, 0.4);
      --purple-accent: #7c3aed;
      --purple-glow: rgba(124, 58, 237, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
      
      /* Phone Chassis Dimensions */
      --phone-w: 380px;
      --phone-h: 780px;
      --phone-radius: 48px;
      --bezel-color: #1e293b;
      --frame-border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at top center, #1e1b4b 0%, #070a14 70%);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER / STUDIO CONTROL BAR ── */
    .studio-header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .studio-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px var(--purple-glow);
      font-size: 20px;
      color: #fff;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #fff, #d4af37);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    /* Control Actions */
    .studio-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-ctrl {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-ctrl:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--gold-primary);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.2);
    }

    .btn-ctrl.active {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border-color: #a855f7;
      box-shadow: 0 0 15px var(--purple-glow);
    }

    .btn-gold {
      background: linear-gradient(135deg, #d4af37, #b8860b);
      color: #000;
      font-weight: 700;
      border: none;
    }

    .btn-gold:hover {
      background: linear-gradient(135deg, #f3e5ab, #d4af37);
      box-shadow: 0 0 18px var(--gold-glow);
    }

    .zoom-slider-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.3);
      padding: 6px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      font-size: 0.8rem;
    }

    .zoom-slider-wrap input {
      width: 100px;
      accent-color: var(--gold-primary);
      cursor: pointer;
    }

    /* ── MAIN STUDIO CANVAS ── */
    .studio-canvas {
      flex: 1;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(390px, 1fr));
      gap: 40px;
      width: 100%;
      max-width: 1700px;
      justify-items: center;
      transition: transform 0.3s ease;
      transform-origin: top center;
    }

    /* ── REALISTIC SMARTPHONE CHASSIS ── */
    .phone-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .phone-device {
      width: var(--phone-w);
      height: var(--phone-h);
      background: #020617;
      border-radius: var(--phone-radius);
      position: relative;
      box-shadow: 
        0 0 0 4px #475569,
        0 0 0 7px #1e293b,
        0 25px 50px -12px rgba(0, 0, 0, 0.8),
        0 0 30px rgba(124, 58, 237, 0.15);
      border: 6px solid #0f172a;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
    }

    .phone-device:hover {
      box-shadow: 
        0 0 0 4px var(--gold-primary),
        0 0 0 8px #1e293b,
        0 30px 60px -10px rgba(0, 0, 0, 0.9),
        0 0 40px var(--gold-glow);
      transform: translateY(-4px);
    }

    /* Phone Dynamic Island / Camera Notch */
    .phone-notch {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 28px;
      background: #000;
      border-radius: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    .camera-lens {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #334155, #000);
      border: 1px solid #1e293b;
    }

    .sensor-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #0f172a;
    }

    /* Phone Status Bar */
    .phone-status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 700;
      color: #fff;
      z-index: 90;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
    }

    /* Phone Screen Viewport */
    .phone-screen {
      width: 100%;
      height: 100%;
      border: none;
      background: #090d1a;
      border-radius: calc(var(--phone-radius) - 6px);
      overflow: hidden;
    }

    .phone-screen iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Phone Home Bar Indicator */
    .phone-home-bar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 130px;
      height: 4px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 10px;
      z-index: 100;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }

    /* ── AGENT INFO CARD UNDER PHONE ── */
    .agent-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 12px 18px;
      width: var(--phone-w);
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .agent-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .agent-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid var(--gold-primary);
      object-fit: cover;
      background: #1e293b;
    }

    .agent-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: #fff;
    }

    .agent-role {
      font-size: 0.75rem;
      color: var(--gold-primary);
    }

    .agent-badge-live {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #4ade80;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 20px;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.5); opacity: 0.4; }
      100% { transform: scale(1); opacity: 1; }
    }

    .agent-actions {
      display: flex;
      gap: 6px;
    }

    .btn-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: var(--gold-primary);
      color: #000;
    }

    /* ── LIVE INTERACTION CONSOLE (BOTTOM DRAWER) ── */
    .studio-console {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      bottom: 0;
      z-index: 1000;
      font-size: 0.82rem;
    }

    .console-feed {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
    }

    .console-tag {
      background: rgba(124, 58, 237, 0.2);
      border: 1px solid rgba(124, 58, 237, 0.5);
      color: #c084fc;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.72rem;
    }
  </style>
</head>
<body>

  <!-- TOP STUDIO CONTROL BAR -->
  <header class="studio-header">
    <div class="studio-brand">
      <div class="brand-logo">
        <i class="fa-solid fa-cross"></i>
      </div>
      <div>
        <div class="brand-title">LUMINA MOBILE STUDIO</div>
        <div class="brand-subtitle">Wielourządzeniowy Symulator Smartfonów Społeczności CC</div>
      </div>
    </div>

    <div class="studio-controls">
      <button class="btn-ctrl active" onclick="switchView('grid')">
        <i class="fa-solid fa-grip"></i> Siatka 7 Telefonów
      </button>
      <button class="btn-ctrl" onclick="switchView('focus')">
        <i class="fa-solid fa-mobile-screen"></i> Pojedynczy Smartfon
      </button>
      <button class="btn-ctrl btn-gold" onclick="injectAllBlessings()">
        <i class="fa-solid fa-dove"></i> Wyślij Błogosławieństwo
      </button>
      <button class="btn-ctrl" onclick="reloadAllPhones()">
        <i class="fa-solid fa-rotate"></i> Odśwież Wszystkie
      </button>
      
      <div class="zoom-slider-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="range" id="zoomSlider" min="50" max="100" value="85" oninput="applyZoom(this.value)">
        <span id="zoomVal">85%</span>
      </div>
    </div>
  </header>

  <!-- MAIN CANVAS WITH 7 SMARTPHONES -->
  <main class="studio-canvas">
    <div class="grid-container" id="phonesGrid">
      <!-- Phone Instances will be dynamically populated -->
    </div>
  </main>

  <!-- BOTTOM CONSOLE BAR -->
  <footer class="studio-console">
    <div class="console-feed">
      <span class="console-tag">MATRIX LIVE</span>
      <span id="consoleStatusText">Aktywny symulator 7 instancji smartfonów. Wszystkie urządzenia zsynchronizowane z chmurą.</span>
    </div>
    <div style="color: var(--gold-primary); font-weight: 600;">
      <i class="fa-solid fa-shield-halved"></i> Standard Mobile First & Zero Regresji
    </div>
  </footer>

  <script>
    const AGENTS_DATA = [
      {
        id: "cezary",
        name: "Cezary Rogowski",
        role: "Założyciel & Dowódca",
        url: "https://polskieradio.cc/lumina.cezaryrgowski",
        avatar: "avatar_cezary_official.jpg",
        time: "10:58"
      },
      {
        id: "wioletta",
        name: "Wioletta Rogowska",
        role: "Liderka Społeczności CC",
        url: "https://polskieradio.cc/lumina.wiolettarogowska",
        avatar: "avatar_wioletta_official.jpg",
        time: "10:58"
      },
      {
        id: "jola",
        name: "Jola Wójcik",
        role: "Użytkownik (Warszawa)",
        url: "https://polskieradio.cc/lumina.jolawojcik",
        avatar: "avatar_jola_official.jpg",
        time: "10:58"
      },
      {
        id: "andrzej",
        name: "Andrzej Thiel",
        role: "Lektor & Muzyk Uwielbienia",
        url: "https://polskieradio.cc/lumina.andrzejthiel",
        avatar: "avatar_andrzej_official.jpg",
        time: "10:58"
      },
      {
        id: "magdalena",
        name: "Magdalena",
        role: "Modlitwa (Gdańsk)",
        url: "https://polskieradio.cc/lumina.magdalena",
        avatar: "avatar_magdalena.jpg",
        time: "10:58"
      },
      {
        id: "ccmen",
        name: "Mężczyźni CC",
        role: "Wspólnota Mężczyzn",
        url: "https://polskieradio.cc/lumina.ccmen",
        avatar: "avatar_ccmen.jpg",
        time: "10:58"
      },
      {
        id: "ccwomen",
        name: "Kobiety CC",
        role: "Wspólnota Kobiet",
        url: "https://polskieradio.cc/lumina.ccwomen",
        avatar: "avatar_ccwomen.jpg",
        time: "10:58"
      }
    ];

    function renderPhones() {
      const grid = document.getElementById('phonesGrid');
      grid.innerHTML = '';

      AGENTS_DATA.forEach((agent, idx) => {
        const wrap = document.createElement('div');
        wrap.className = 'phone-wrapper';
        wrap.id = `phone-wrap-${agent.id}`;

        wrap.innerHTML = `
          <div class="phone-device" id="device-${agent.id}">
            <!-- Dynamic Island -->
            <div class="phone-notch">
              <div class="sensor-dot"></div>
              <div class="camera-lens"></div>
            </div>

            <!-- Status Bar -->
            <div class="phone-status-bar">
              <span>${agent.time}</span>
              <div class="status-icons">
                <i class="fa-solid fa-signal"></i>
                <span>5G</span>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
              </div>
            </div>

            <!-- Screen Viewport -->
            <div class="phone-screen">
              <iframe id="iframe-${agent.id}" src="${agent.url}" loading="lazy"></iframe>
            </div>

            <!-- Home Bar -->
            <div class="phone-home-bar"></div>
          </div>

          <!-- Info Card -->
          <div class="agent-card">
            <div class="agent-meta">
              <img src="${agent.avatar}" class="agent-avatar" onerror="this.src='lumina-icon-192.png'">
              <div>
                <div class="agent-name">${agent.name}</div>
                <div class="agent-role">${agent.role}</div>
              </div>
            </div>
            <div class="agent-badge-live">
              <div class="pulse-dot"></div> ONLINE
            </div>
          </div>
        `;

        grid.appendChild(wrap);
      });
    }

    function applyZoom(val) {
      document.getElementById('zoomVal').innerText = val + '%';
      const scale = val / 100;
      document.getElementById('phonesGrid').style.transform = `scale(${scale})`;
    }

    function reloadAllPhones() {
      AGENTS_DATA.forEach(agent => {
        const iframe = document.getElementById(`iframe-${agent.id}`);
        if (iframe) iframe.src = iframe.src;
      });
      document.getElementById('consoleStatusText').innerText = "Odświeżono wszystkie ekrany smartfonów.";
    }

    function injectAllBlessings() {
      document.getElementById('consoleStatusText').innerText = "✨ Wysłano impuls Błogosławieństwa Czasu Rzeczywistego do wszystkich 7 telefonów!";
      alert("🕊️ Wysłano poranne błogosławieństwo biblijne do wszystkich 7 aktywnych urządzeń w symulatorze!");
    }

    function switchView(mode) {
      const grid = document.getElementById('phonesGrid');
      if (mode === 'focus') {
        grid.style.gridTemplateColumns = '1fr';
        applyZoom(100);
        document.getElementById('zoomSlider').value = 100;
      } else {
        grid.style.gridTemplateColumns = 'repeat(auto-fit, minmax(390px, 1fr))';
        applyZoom(85);
        document.getElementById('zoomSlider').value = 85;
      }
    }

    // Start
    renderPhones();
    applyZoom(85);
  </script>
</body>
</html>
