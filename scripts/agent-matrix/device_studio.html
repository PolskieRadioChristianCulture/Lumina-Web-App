<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>MATRIX CC — Wielourządzeniowy Symulator Smartfonów & Centrum Automatyzacji</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      /* ── PALETA: CZERŃ + SZCZOTKOWANY METAL + SZKŁO 3D ── */
      --bg-void:        #000000;
      --bg-dark:        #080808;
      --bg-surface:     #0d0d0d;
      --metal-light:    #b0b8c8;
      --metal-mid:      #6b7280;
      --metal-dark:     #1c1c1e;
      --metal-shine:    #d1d5db;
      --glass-bg:       rgba(255, 255, 255, 0.04);
      --glass-border:   rgba(255, 255, 255, 0.10);
      --glass-shine:    rgba(255, 255, 255, 0.18);
      --accent-chrome:  #c0c8d8;
      --accent-cyan:    #00d4ff;
      --accent-cyan-glow: rgba(0, 212, 255, 0.35);
      --accent-silver:  #e8ecf0;
      --gold-primary:   #c8a84b;
      --gold-glow:      rgba(200, 168, 75, 0.4);
      --text-main:      #e8ecf0;
      --text-muted:     #6b7280;
      --text-dim:       #374151;
      --border-metal:   rgba(192, 200, 216, 0.18);
      --border-glow:    rgba(0, 212, 255, 0.3);
      --shadow-deep:    0 32px 80px rgba(0,0,0,0.9);
      --phone-w:        380px;
      --phone-h:        760px;
      --phone-radius:   46px;
    }

    /* ── ANIMACJE 3D ── */
    @keyframes floatIn {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }
    @keyframes shimmer {
      0%   { background-position: -200% center; }
      100% { background-position:  200% center; }
    }
    @keyframes scanline {
      0%   { transform: translateY(-100%); opacity: 0.08; }
      100% { transform: translateY(100vh); opacity: 0; }
    }
    @keyframes pulseAnim {
      0%,100% { transform: scale(1);   opacity: 1;   }
      50%      { transform: scale(1.7); opacity: 0.2; }
    }
    @keyframes pulse {
      0%,100% { transform: scale(1);   opacity: 1; }
      50%      { transform: scale(1.3); opacity: 0.4; }
    }
    @keyframes rotateMetal {
      0%   { background-position: 0%   50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0%   50%; }
    }
    @keyframes glowPulse {
      0%,100% { box-shadow: 0 0 8px var(--accent-cyan-glow); }
      50%      { box-shadow: 0 0 24px var(--accent-cyan-glow), 0 0 48px rgba(0,212,255,0.15); }
    }
    @keyframes phoneEntrance {
      from { opacity:0; transform: perspective(800px) rotateY(-8deg) translateY(20px) scale(0.95); }
      to   { opacity:1; transform: perspective(800px) rotateY(0deg)  translateY(0)    scale(1); }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body, button, select, label { user-select: none; }
    input, textarea { user-select: text; -webkit-user-select: text; }

    body {
      background: var(--bg-void);
      background-image:
        radial-gradient(ellipse at 20% 0%,  rgba(0,212,255,0.04) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 0%,  rgba(192,200,216,0.03) 0%, transparent 40%),
        radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0) 0%, #000 100%);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: auto;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Subtelna siatka tła (holographic grid) */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,212,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    /* Ruchomy pasek skanowania */
    body::after {
      content: '';
      position: fixed;
      left: 0; top: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, rgba(0,212,255,0.6), transparent);
      animation: scanline 6s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER METAL ── */
    .matrix-header {
      background:
        linear-gradient(180deg,
          rgba(28,28,30,0.98) 0%,
          rgba(16,16,18,0.95) 100%);
      border-bottom: 1px solid var(--border-metal);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.06) inset,
        0 8px 40px rgba(0,0,0,0.8),
        0 1px 0 rgba(0,212,255,0.15);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
      flex-wrap: wrap;
      gap: 12px;
      transition: padding 0.3s ease, gap 0.3s ease;
      overflow: hidden;
      position: relative;
    }

    /* Szczotkowany metalowy połysk w headerze */
    .matrix-header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        transparent,
        transparent 2px,
        rgba(255,255,255,0.015) 2px,
        rgba(255,255,255,0.015) 3px
      );
      pointer-events: none;
    }

    /* Przycisk Toggle Belki */
    .btn-header-toggle {
      position: fixed;
      top: 8px;
      right: 14px;
      z-index: 1100;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(28,28,30,0.95);
      border: 1px solid var(--border-metal);
      color: var(--accent-chrome);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.8), 0 0 0 1px rgba(0,212,255,0.2);
      transition: all 0.25s;
    }

    .btn-header-toggle:hover {
      background: rgba(0,212,255,0.12);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      box-shadow: 0 0 16px var(--accent-cyan-glow);
      transform: scale(1.1);
    }

    /* Belka zwinięta */
    .matrix-header.collapsed {
      padding: 0;
      gap: 0;
      border-bottom-color: transparent;
      box-shadow: none;
    }
    .matrix-header.collapsed .matrix-brand,
    .matrix-header.collapsed .matrix-toolbar {
      max-height: 0; opacity: 0; overflow: hidden;
      pointer-events: none;
      transition: max-height 0.3s ease, opacity 0.25s ease;
    }
    .matrix-header:not(.collapsed) .matrix-brand,
    .matrix-header:not(.collapsed) .matrix-toolbar {
      max-height: 200px; opacity: 1; overflow: visible;
      pointer-events: auto;
      transition: max-height 0.35s ease, opacity 0.3s ease;
    }

    /* Mini-pill */
    .header-mini-pill {
      display: none;
      position: fixed;
      top: 6px; left: 12px;
      z-index: 1050;
      background: rgba(20,20,22,0.95);
      border: 1px solid var(--border-metal);
      border-radius: 20px;
      padding: 4px 12px 4px 8px;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem; font-weight: 700;
      color: var(--accent-chrome);
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,212,255,0.15);
      cursor: pointer; transition: all 0.2s;
    }
    .header-mini-pill:hover {
      background: rgba(0,212,255,0.08);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }
    .header-mini-pill.visible { display: flex; }

    .mini-pill-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #00d4ff;
      box-shadow: 0 0 8px rgba(0,212,255,0.8);
      animation: pulse 1.5s infinite;
    }

    /* Brand */
    .matrix-brand { display: flex; align-items: center; gap: 14px; }

    .brand-logo {
      width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(135deg, #1c1c1e 0%, #2d2d30 50%, #111113 100%);
      border: 1px solid var(--border-metal);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 0 1px rgba(0,212,255,0.2), 0 4px 20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
      font-size: 22px; color: var(--accent-cyan);
      position: relative; overflow: hidden;
    }
    .brand-logo::after {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: linear-gradient(135deg, transparent 40%, rgba(0,212,255,0.1) 50%, transparent 60%);
      animation: shimmer 3s infinite;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 1.35rem; font-weight: 800; letter-spacing: 2px;
      background: linear-gradient(90deg, var(--metal-shine) 0%, var(--accent-chrome) 40%, var(--accent-cyan) 60%, var(--metal-shine) 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 4s linear infinite;
    }

    .brand-subtitle {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      font-weight: 500;
    }

    /* Toolbar */
    .matrix-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .btn-action {
      background:
        linear-gradient(145deg,
          rgba(40,40,44,0.95) 0%,
          rgba(22,22,24,0.98) 100%);
      border: 1px solid var(--border-metal);
      color: var(--accent-chrome);
      padding: 8px 15px;
      border-radius: 10px;
      font-size: 0.83rem; font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 8px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
      position: relative; overflow: hidden;
      font-family: inherit;
    }
    .btn-action::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.04) 50%, transparent 60%);
      transition: opacity 0.3s;
      opacity: 0;
    }
    .btn-action:hover::before { opacity: 1; }
    .btn-action:hover {
      background:
        linear-gradient(145deg,
          rgba(0,212,255,0.08) 0%,
          rgba(30,30,34,0.98) 100%);
      border-color: rgba(0,212,255,0.4);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.6), 0 0 12px rgba(0,212,255,0.2);
    }

    .btn-add-phone {
      background: linear-gradient(145deg, #0d3d2a, #052218);
      border: 1px solid rgba(0,200,100,0.4);
      color: #4ade80;
      box-shadow: 0 0 12px rgba(0,180,80,0.2), inset 0 1px 0 rgba(74,222,128,0.1);
    }
    .btn-add-phone:hover {
      background: linear-gradient(145deg, #134d34, #0a2e1f);
      border-color: rgba(74,222,128,0.6);
      color: #86efac;
      box-shadow: 0 0 20px rgba(0,200,100,0.35);
    }

    .btn-gold {
      background: linear-gradient(145deg, #2a200a, #1a140a);
      border: 1px solid rgba(200,168,75,0.5);
      color: var(--gold-primary);
      font-weight: 700;
      box-shadow: 0 0 12px rgba(200,168,75,0.2), inset 0 1px 0 rgba(200,168,75,0.1);
    }
    .btn-gold:hover {
      background: linear-gradient(145deg, #3a2c0e, #231c0c);
      border-color: rgba(200,168,75,0.8);
      color: #f4c842;
      box-shadow: 0 0 24px rgba(200,168,75,0.4);
    }

    .btn-logout-all {
      background: linear-gradient(145deg, #2d0a0a, #1c0606);
      border: 1px solid rgba(220,38,38,0.4);
      color: #f87171;
      font-weight: 700;
      box-shadow: 0 0 10px rgba(220,38,38,0.15);
    }
    .btn-logout-all:hover {
      background: linear-gradient(145deg, #3d1010, #260a0a);
      border-color: rgba(239,68,68,0.7);
      color: #fca5a5;
      box-shadow: 0 0 20px rgba(239,68,68,0.35);
    }

    .layout-switcher, .server-switcher {
      display: flex; align-items: center;
      background: rgba(0,0,0,0.6);
      padding: 4px; border-radius: 10px;
      border: 1px solid var(--border-metal);
      gap: 4px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
    }

    .layout-btn, .server-btn {
      padding: 6px 12px; font-size: 0.78rem;
      border-radius: 8px; border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer; font-weight: 600;
      transition: all 0.2s;
      font-family: inherit;
    }
    .layout-btn.active {
      background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(0,212,255,0.05));
      color: var(--accent-cyan);
      border: 1px solid rgba(0,212,255,0.3);
      box-shadow: 0 0 12px rgba(0,212,255,0.15);
    }
    .server-btn.active {
      background: linear-gradient(135deg, rgba(0,212,255,0.12), rgba(0,100,150,0.1));
      color: #7dd3fc;
      border: 1px solid rgba(125,211,252,0.3);
    }

    .zoom-ctrl {
      display: flex; align-items: center; gap: 8px;
      background: rgba(0,0,0,0.5);
      padding: 6px 14px; border-radius: 10px;
      border: 1px solid var(--border-metal);
      font-size: 0.8rem; color: var(--text-muted);
    }
    .zoom-ctrl input { width: 90px; accent-color: var(--accent-cyan); cursor: pointer; }

    /* ── CANVAS ── */
    .studio-canvas {
      flex: 1; padding: 28px 16px;
      display: flex; flex-direction: column; align-items: center;
      overflow-x: auto; min-width: 100%;
      position: relative; z-index: 1;
    }

    .phones-grid {
      display: flex; flex-wrap: wrap; gap: 28px;
      width: 100%; max-width: 100%;
      justify-content: center;
      transform-origin: top center;
      transition: transform 0.25s ease, gap 0.25s ease;
    }
    .phones-grid.mode-row {
      display: flex !important; flex-direction: row !important;
      flex-wrap: nowrap !important; gap: 16px !important;
      width: max-content !important; justify-content: center !important;
    }

    /* ── PHONE CARD ── */
    .phone-unit {
      display: flex; flex-direction: column; align-items: center;
      gap: 14px;
      background:
        linear-gradient(145deg,
          rgba(20,20,22,0.9) 0%,
          rgba(12,12,14,0.95) 100%);
      border: 1px solid var(--border-metal);
      border-radius: 24px;
      padding: 16px;
      box-shadow:
        0 20px 60px rgba(0,0,0,0.8),
        inset 0 1px 0 rgba(255,255,255,0.06),
        inset 0 -1px 0 rgba(0,0,0,0.5);
      backdrop-filter: blur(20px);
      transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
      width: calc(var(--phone-w) + 32px);
      flex-shrink: 0;
      animation: phoneEntrance 0.5s ease both;
      position: relative; overflow: hidden;
    }
    /* Szczotkowany metal na kartach */
    .phone-unit::before {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        -60deg,
        transparent, transparent 3px,
        rgba(255,255,255,0.008) 3px, rgba(255,255,255,0.008) 4px
      );
      border-radius: 24px;
      pointer-events: none;
    }
    .phone-unit:hover {
      border-color: rgba(0,212,255,0.3);
      box-shadow:
        0 28px 80px rgba(0,0,0,0.9),
        0 0 30px rgba(0,212,255,0.1),
        inset 0 1px 0 rgba(255,255,255,0.08);
      transform: translateY(-4px);
    }

    .phone-unit-header { width: 100%; display: flex; flex-direction: column; gap: 10px; }
    .phone-header-top { display: flex; align-items: center; justify-content: space-between; }

    .phone-id-badge {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.78rem; font-weight: 700;
      color: var(--accent-chrome);
      background: rgba(192,200,216,0.06);
      border: 1px solid var(--border-metal);
      padding: 4px 10px; border-radius: 8px;
    }

    .phone-header-actions { display: flex; gap: 6px; }

    .btn-tiny {
      width: 28px; height: 28px; border-radius: 6px;
      border: 1px solid var(--border-metal);
      background: rgba(0,0,0,0.5);
      color: var(--text-muted);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; transition: all 0.2s;
    }
    .btn-tiny:hover { color: #fff; border-color: var(--accent-cyan); background: rgba(0,212,255,0.1); }
    .btn-tiny.delete:hover { background: rgba(239,68,68,0.2); border-color: #f87171; color: #fca5a5; }

    .profile-select-wrap { width: 100%; display: flex; gap: 6px; }
    .select-profile {
      flex: 1;
      background: linear-gradient(145deg, rgba(16,16,18,0.98), rgba(10,10,12,0.98));
      border: 1px solid var(--border-metal);
      color: var(--accent-chrome);
      padding: 8px 12px; border-radius: 10px;
      font-size: 0.82rem; font-weight: 600;
      outline: none; cursor: pointer;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
      font-family: inherit;
    }
    .select-profile option { background: #111113; color: #e8ecf0; padding: 6px; }

    /* ── OBUDOWA TELEFONU 3D ── */
    .phone-device {
      width: var(--phone-w);
      height: var(--phone-h);
      background:
        linear-gradient(160deg,
          #0f0f11 0%,
          #080809 40%,
          #060607 100%);
      border-radius: var(--phone-radius);
      position: relative;
      box-shadow:
        0 0 0 2px #2a2a2e,
        0 0 0 4px #1a1a1c,
        0 0 0 6px #0a0a0b,
        0 30px 80px -10px rgba(0,0,0,1),
        0 0 40px rgba(0,212,255,0.06),
        inset 0 1px 0 rgba(255,255,255,0.05),
        inset 0 -1px 0 rgba(0,0,0,0.8);
      border: none;
      overflow: hidden;
      display: flex; flex-direction: column;
      /* Szczotkowane boki */
      background-image:
        repeating-linear-gradient(
          180deg,
          transparent, transparent 1px,
          rgba(255,255,255,0.012) 1px, rgba(255,255,255,0.012) 2px
        );
    }

    .phone-notch {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      width: 105px; height: 26px;
      background: #000;
      border-radius: 20px; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 10px;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.04);
    }
    .camera-lens {
      width: 10px; height: 10px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #1a2030, #000);
      border: 1px solid rgba(0,212,255,0.3);
      box-shadow: 0 0 6px rgba(0,212,255,0.2);
    }
    .sensor-dot { width: 5px; height: 5px; border-radius: 50%; background: #0a0f15; }

    .phone-status-bar {
      position: absolute; top: 0; left: 0; right: 0; height: 42px;
      padding: 0 22px;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.72rem; font-weight: 700;
      color: rgba(232,236,240,0.85);
      z-index: 90; pointer-events: none;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }
    .status-icons { display: flex; align-items: center; gap: 5px; font-size: 0.68rem; }

    .phone-screen {
      width: 100%; height: 100%; border: none;
      background: #000;
      border-radius: calc(var(--phone-radius) - 5px);
      overflow: hidden; position: relative;
    }
    .phone-screen iframe { width: 100%; height: 100%; border: none; display: block; }

    .phone-home-bar {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      width: 120px; height: 4px;
      background: linear-gradient(90deg, transparent, rgba(192,200,216,0.5), transparent);
      border-radius: 10px; z-index: 100; pointer-events: none;
    }

    /* ── FOOTER TELEFONÓW ── */
    .phone-unit-footer { width: 100%; display: flex; flex-direction: column; gap: 10px; }

    .url-bar-wrap {
      display: flex; align-items: center; gap: 5px;
      background: rgba(0,0,0,0.7);
      border: 1px solid var(--border-metal);
      border-radius: 10px; padding: 4px 8px;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
      transition: border-color 0.2s;
    }
    .url-bar-wrap:focus-within {
      border-color: rgba(0,212,255,0.4);
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.6), 0 0 0 2px rgba(0,212,255,0.1);
    }
    .url-input-field {
      flex: 1; background: transparent; border: none;
      color: var(--accent-cyan);
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.76rem; outline: none; padding: 4px;
      user-select: text;
    }
    .url-input-field::placeholder { color: var(--text-dim); font-family: 'Plus Jakarta Sans', sans-serif; }

    .btn-url-action {
      background: rgba(20,20,22,0.8);
      border: 1px solid var(--border-metal);
      color: var(--accent-chrome);

    function getBaseUrl() {
      return currentServer === 'local' ? LOCAL_BASE : PROD_BASE;

    function getPhoneUrl(phone) {
      if (phone.customUrl && phone.customUrl.trim() !== '') {
        return normalizeUrl(phone.customUrl);
      }
      const p = PROFILE_OPTIONS.find(x => x.id === phone.profileId) || PROFILE_OPTIONS[0];
      if (p.isBrowser) return 'search.html';
      if (p.isYT)      return 'yt_embed_viewer.html';
      if (!p.path)     return 'search.html';
      return `${getBaseUrl()}${p.path}`;
    }

    function normalizeUrl(input) {
      let raw = input.trim();
      if (!raw) return `${getBaseUrl()}/lumina`;

      let decoded = raw;
      try { decoded = decodeURIComponent(raw); } catch (e) {}

      // Rozpoznaj bezpośredni @handle (wpisany bez youtube.com)
      if (/^@[a-zA-Z0-9_\u0080-\uFFFF.-]+$/.test(decoded)) {
        return `yt_embed_viewer.html?channel=${encodeURIComponent(decoded)}`;
      }

      // YouTube — dowolny film, kanal lub shorts
      if (decoded.includes('youtube.com') || decoded.includes('youtu.be')) {

        // 1. Shorts
        const shortsMatch = decoded.match(/youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/i);
        if (shortsMatch && shortsMatch[1]) {
          return `yt_embed_viewer.html?v=${shortsMatch[1]}&type=shorts`;
        }

        // 2. Konkretny film (watch?v= lub youtu.be/)
        const videoMatch = decoded.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|v\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/i);
        if (videoMatch && videoMatch[1]) {
          return `yt_embed_viewer.html?v=${videoMatch[1]}`;
        }

        // 3. Playlista (?list=PLxxxx)
        const playlistMatch = decoded.match(/[?&]list=([a-zA-Z0-9_-]+)/i);
        if (playlistMatch && playlistMatch[1]) {
          return `yt_embed_viewer.html?list=${playlistMatch[1]}`;
        }

        // 4. Kanał po @handle
        const handleMatch = decoded.match(/@([a-zA-Z0-9_\u0080-\uFFFF.-]+)/);
        if (handleMatch && handleMatch[0]) {
          return `yt_embed_viewer.html?channel=${encodeURIComponent(handleMatch[0])}`;
        }

        // 5. Wyszukiwanie / inne URL YouTube
        const qParam = decoded.match(/[?&](?:q|search_query)=([^&]+)/i);
        if (qParam && qParam[1]) {
          return `yt_embed_viewer.html?q=${qParam[1]}`;
        }

        // Fallback — zaladuj w viewerze z pelnym URL
        return `yt_embed_viewer.html?q=${encodeURIComponent(decoded)}`;
      }

      if (raw.startsWith('/')) return `${getBaseUrl()}${raw}`;
      if (!/^https?:\/\//i.test(raw)) {
        raw = 'https://' + raw;
      }
      return raw;
    }

    // Load Custom URL entered in input field
    function loadCustomUrl(id) {
      const input = document.getElementById(`url-input-${id}`);
      if (!input) return;
      const rawVal = input.value.trim();
      if (!rawVal) return;

      const phone = phones.find(p => p.id === id);
      const iframe = document.getElementById(`iframe-${id}`);
      if (!iframe || !phone) return;

      // Wyznacz docelowy URL przez normalizeUrl
      let normalized = normalizeUrl(rawVal);

      // Jeśli URL jest zewnętrzny (http/https) i NIE jest to plik lokalny (browser.html, yt_embed_viewer.html, etc.)
      // → załaduj przez browser.html żeby działało wyszukiwanie i obsługa blokad iframe
      const isLocal = normalized.startsWith('browser.html') ||
                      normalized.startsWith('yt_embed_viewer.html') ||
                      normalized.startsWith('./') ||
                      normalized.startsWith('../') ||
                      normalized.includes('polskieradio.cc') ||
                      normalized.includes('localhost:');

      if (!isLocal && (normalized.startsWith('http://') || normalized.startsWith('https://'))) {
        normalized = `browser.html?url=${encodeURIComponent(normalized)}`;
      }

      // Zapamiętaj oryginalny wpisany URL — nie nadpisuj inputa
      phone.customUrl = rawVal;
      // Zostaw aktualny profil jeśli to browser, inaczej ustaw custom
      if (phone.profileId !== 'browser') {
        phone.profileId = 'custom';
      }
      saveState();

      iframe.src = normalized;
      input.blur();
      const idx = phones.findIndex(p => p.id === id) + 1;
      document.getElementById('matrixStatus').innerText = `📱 Telefon #${idx}: Ładuję "${rawVal}"`;
    }

    // Paste from Clipboard and Load
    async function pasteAndLoadUrl(id) {
      try {
        const text = await navigator.clipboard.readText();
        if (text && text.trim()) {
          const input = document.getElementById(`url-input-${id}`);
          if (input) {
            input.value = text.trim();
            loadCustomUrl(id);
          }
        }
      } catch (err) {
        // Fallback prompt if clipboard API blocked
        const pasted = prompt("Wklej adres URL (https://... lub www...):");
        if (pasted && pasted.trim()) {
          const input = document.getElementById(`url-input-${id}`);
          if (input) {
            input.value = pasted.trim();
            loadCustomUrl(id);
          }
        }
      }
    }

    // Add New Phone
    function addNewPhone() {
      const newId = Date.now();
      phones.push({
        id: newId,
        profileId: "browser",
        autoId: "none",
        autoActive: false,
        deviceTime: "11:35",
        customUrl: ""
      });
      saveState();
      renderGrid();
      document.getElementById('matrixStatus').innerText = `Dodano nowy telefon #${phones.length}. Przeglądarka Google gotowa.`;
    }

    // Delete Phone
    function deletePhone(id) {
      if (phones.length <= 1) {
        alert("Musi pozostać co najmniej jeden wirtualny telefon.");
        return;
      }
      phones = phones.filter(p => p.id !== id);
      saveState();
      renderGrid();
    }

    // Change Profile
    function changePhoneProfile(id, newProfileId) {
      const phone = phones.find(p => p.id === id);
      if (phone) {
        phone.profileId = newProfileId;
        if (newProfileId !== 'custom') {
          phone.customUrl = '';
        }
        saveState();
        const iframe = document.getElementById(`iframe-${id}`);
        const input = document.getElementById(`url-input-${id}`);
        const newUrl = getPhoneUrl(phone);
        if (iframe) iframe.src = newUrl;
        if (input) input.value = newUrl;
      }
    }

    // Change Automation
    function changePhoneAuto(id, newAutoId) {
      const phone = phones.find(p => p.id === id);
      if (phone) {
        phone.autoId = newAutoId;
        saveState();
      }
    }

    // Toggle Automation
    function togglePhoneAuto(id) {
      const phone = phones.find(p => p.id === id);
      if (phone) {
        phone.autoActive = !phone.autoActive;
        saveState();
        renderGrid();
      }
    }

    // Toggle All Automations
    function toggleAllAutomations() {
      const anyActive = phones.some(p => p.autoActive);
      phones.forEach(p => p.autoActive = !anyActive);
      saveState();
      renderGrid();
      document.getElementById('matrixStatus').innerText = anyActive ? "Wyłączono wszystkie automatyzacje." : "Uruchomiono wszystkie automatyzacje!";
    }

    // Google Login Action - Scoped to individual phone session
    function loginWithGoogle(id) {
      const idx = phones.findIndex(p => p.id === id) + 1;
      const loginUrl = `${getBaseUrl()}/lumina-login.html?phone_id=${id}&session_id=${id}`;

      // Otwórz w dedykowanym, niezależnym oknie dla tego telefonu
      window.open(loginUrl, `matrix_auth_session_${id}`, 'width=460,height=740,menubar=no,toolbar=no');

      const iframe = document.getElementById(`iframe-${id}`);
      const input = document.getElementById(`url-input-${id}`);
      if (iframe) iframe.src = loginUrl;
      if (input) input.value = loginUrl;

      document.getElementById('matrixStatus').innerText = `🔑 Telefon #${idx}: Uruchomiono niezależną ścieżkę logowania (Sesja #${idx}).`;
    }

    // Single Phone Logout Action
    function logoutSinglePhone(id) {
      const idx = phones.findIndex(p => p.id === id) + 1;
      const phone = phones.find(p => p.id === id);
      if (phone) {
        phone.profileId = "browser";
        phone.customUrl = "search.html";
        saveState();
        const iframe = document.getElementById(`iframe-${id}`);
        const input = document.getElementById(`url-input-${id}`);
        if (iframe) iframe.src = 'search.html';
        if (input) input.value = 'search.html';
        document.getElementById('matrixStatus').innerText = `🔓 Telefon #${idx}: Wylogowano sesję i przywrócono czystą wyszukiwarkę.`;
      }
    }

    // Quick Navigate
    function navigatePhone(id, path) {
      const fullUrl = `${getBaseUrl()}${path}`;
      const iframe = document.getElementById(`iframe-${id}`);
      const input = document.getElementById(`url-input-${id}`);
      if (iframe) iframe.src = fullUrl;
      if (input) input.value = fullUrl;
    }

    // Reload Phone
    function reloadPhone(id) {
      const iframe = document.getElementById(`iframe-${id}`);
      if (iframe) iframe.src = iframe.src;
    }

    // Reload All
    function reloadAll() {
      phones.forEach(p => reloadPhone(p.id));
      document.getElementById('matrixStatus').innerText = "Odświeżono wszystkie ekrany telefonów.";
    }

    // Open Window
    function openWindow(url) {
      window.open(url, '_blank', 'width=420,height=860');
    }

    // Global Blessing
    function sendGlobalBlessing() {
      alert("🕊️ Wysłano impuls Bożego Błogosławieństwa Czasu Rzeczywistego do wszystkich wirtualnych telefonów w Matrix CC!");
      document.getElementById('matrixStatus').innerText = "✨ Wysłano impuls błogosławieństwa biblijnego do wszystkich aktywnych telefonów.";
    }

    // Logout From All Virtual Phones
    function logoutFromAll() {
      if (!confirm("Czy na pewno chcesz wylogować wszystkie wirtualne telefony i zresetować aktywne sesje?")) {
        return;
      }

      phones.forEach(phone => {
        const iframe = document.getElementById(`iframe-${phone.id}`);
        const input = document.getElementById(`url-input-${phone.id}`);
        const logoutUrl = `${getBaseUrl()}/lumina-login.html?logout=true&ts=${Date.now()}`;
        
        try {
          if (iframe && iframe.contentWindow) {
            iframe.contentWindow.postMessage({ type: 'LUMINA_FORCE_LOGOUT' }, '*');
          }
        } catch (e) {}

        if (iframe) iframe.src = logoutUrl;
        if (input) input.value = `${getBaseUrl()}/lumina-login.html`;
        phone.profileId = "login";
        phone.customUrl = "";
      });

      saveState();
      document.getElementById('matrixStatus').innerText = "🚪 Pomyślnie wylogowano wszystkie telefony. Sesje zostały zresetowane.";
      alert("✅ Pomyślnie wylogowano ze wszystkich wirtualnych telefonów!");
    }

    // Server Switcher
    function setServer(srv) {
      currentServer = srv;
      document.getElementById('srvProd').className = 'server-btn ' + (srv === 'prod' ? 'active' : '');
      document.getElementById('srvLocal').className = 'server-btn ' + (srv === 'local' ? 'active' : '');
      reloadAll();
    }

    // Layout Switcher
    function setLayoutMode(mode) {
      currentLayoutMode = mode;
      document.getElementById('btnLayoutRow').className = 'layout-btn ' + (mode === 'row' ? 'active' : '');
      document.getElementById('btnLayoutAuto').className = 'layout-btn ' + (mode === 'auto' ? 'active' : '');
      applyZoom(document.getElementById('zoomSlider').value);
    }

    // Zoom
    function applyZoom(val) {
      document.getElementById('zoomVal').innerText = val + '%';
      const scale = val / 100;
      const grid = document.getElementById('phonesGrid');
      grid.style.transform = `scale(${scale})`;

      // Przy skali <= 50% lub przy aktywnym trybie "row" telefony ustawiają się w 1 poziomym rzędzie
      if (val <= 50 || currentLayoutMode === 'row') {
        grid.classList.add('mode-row');
      } else {
        grid.classList.remove('mode-row');
      }
    }

    // ── TOGGLE BELKI STEROWANIA ──
    let headerCollapsed = false;

    function toggleHeader() {
      const header = document.getElementById('matrixHeader');
      const icon = document.getElementById('headerToggleIcon');
      const pill = document.getElementById('headerMiniPill');

      headerCollapsed = !headerCollapsed;

      if (headerCollapsed) {
        header.classList.add('collapsed');
        icon.className = 'fa-solid fa-chevron-down';
        pill.classList.add('visible');
        localStorage.setItem('matrix_header_collapsed', '1');
      } else {
        header.classList.remove('collapsed');
        icon.className = 'fa-solid fa-chevron-up';
        pill.classList.remove('visible');
        localStorage.setItem('matrix_header_collapsed', '0');
      }
    }

    // Skrót klawiszowy: klawisz H (gdy nie wpisujemy w input)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
          toggleHeader();
        }
      }
    });

    // ── POSTMESSAGE: search.html/browser.html → device_studio navigation ──
    window.addEventListener('message', (e) => {
      if (!e.data || e.data.type !== 'MATRIX_NAVIGATE') return;
      const url = e.data.url;
      if (!url) return;

      // Find which phone's iframe sent this
      const iframes = document.querySelectorAll('iframe[id^="iframe-"]');
      for (const iframe of iframes) {
        if (iframe.contentWindow === e.source) {
          const phoneId = parseInt(iframe.id.replace('iframe-', ''));
          const normalized = normalizeUrl(url);
          iframe.src = normalized;

          // Update URL bar
          const inp = document.getElementById(`url-input-${phoneId}`);
          if (inp) inp.value = url;

          // Save state
          const phone = phones.find(p => p.id === phoneId);
          if (phone) { phone.customUrl = url; saveState(); }
          break;
        }
      }
    });

    // Init
    loadSavedState();
    renderGrid();
    applyZoom(40);

    // Przywróć stan belki z localStorage
    if (localStorage.getItem('matrix_header_collapsed') === '1') {
      toggleHeader();
    }
  </script>
</body>
</html>
