        @keyframes sceneBreathing {
            0% { transform: scale(1.0); filter: brightness(0.9) contrast(1); }
            50% { transform: scale(1.1); filter: brightness(1.1) contrast(1.05); }
            100% { transform: scale(1.0); filter: brightness(0.9) contrast(1); }

        @keyframes heroPanZoom {

        }

        @keyframes lightSweep {
            0% { opacity: 0.2; background-position: -200% 0; }
            50% { opacity: 0.4; background-position: 200% 0; }
            100% { opacity: 0.2; background-position: -200% 0; }
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.2); }
        }

        .animate-scene {
            animation: sceneBreathing 40s ease-in-out infinite;
        }

        .animate-hero-dynamic {
            animation: heroPanZoom 25s ease-in-out infinite;
            transform-origin: center center;
        }

        .light-overlay {
            background: linear-gradient(115deg, transparent 40%, rgba(59,130,246,0.15) 50%, transparent 60%);

            animation: lightSweep 25s linear infinite;

        }

        .pronounced-center-overlay {
