<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#07080a" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4db" />
      <stop offset="40%" stop-color="#dfb872" />
      <stop offset="100%" stop-color="#9e7b2b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with subtle border -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="#dfb872" stroke-width="3" stroke-opacity="0.3" />
  
  <!-- Subtle halo glow -->
  <circle cx="96" cy="90" r="48" fill="#dfb872" fill-opacity="0.08" filter="url(#glow)" />
  
  <!-- Latin Cross -->
  <g fill="url(#goldGrad)" filter="url(#glow)">
    <!-- Vertical beam -->
    <rect x="88" y="38" width="16" height="116" rx="4" />
    <!-- Horizontal beam -->
    <rect x="54" y="68" width="84" height="16" rx="4" />
  </g>
</svg>
