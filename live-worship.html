    <meta charset="UTF-8">

    <title>INSTRUMENTAL WORSHIP - Radio Christian Culture</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        /* === TŁO SPECJALNE: 1 SIERPNIA — POWSTANIE WARSZAWSKIE === */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url('tlo_powstanie_1944.jpg');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            filter: brightness(0.45) saturate(1.2);
            z-index: 0;
            animation: subtle-zoom 30s ease-in-out infinite alternate;
        }
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(5, 0, 15, 0.3) 0%,
                rgba(100, 0, 0, 0.15) 50%,
                rgba(5, 0, 15, 0.6) 100%
            );
            z-index: 1;
        }
        @keyframes subtle-zoom {
            from { transform: scale(1.0); }
            to   { transform: scale(1.06); }
        }
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(10, 5, 20, 0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(220, 38, 38, 0.35);
            box-shadow: 0 10px 60px rgba(0,0,0,0.85), 0 0 30px rgba(200, 0, 0, 0.15) inset;
            max-width: 600px;
            width: 90%;
        }
        .logo {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #dc2626;
            box-shadow: 0 0 25px rgba(220, 38, 38, 0.55), 0 0 60px rgba(220, 38, 38, 0.2);
            margin-bottom: 20px;
        }
        /* Odznaka rocznicowa nad logo */
        .anniversary-badge {
            display: inline-block;
            background: linear-gradient(135deg, #dc2626, #991b1b);
            color: #fff;
            font-family: 'Cinzel', serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            padding: 5px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
            text-transform: uppercase;
            box-shadow: 0 2px 12px rgba(220,38,38,0.5);
        }
        h1 {
            font-family: 'Cinzel', serif;
            color: #f5f5f5;
            font-size: 28px;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(220, 38, 38, 0.6);
        }
        p {
            color: #d1d5db;
            font-size: 16px;
            margin-bottom: 25px;
        }
        .status-badge {
            display: inline-block;
            padding: 8px 18px;
            background: rgba(220, 38, 38, 0.2);
            color: #fca5a5;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid rgba(220, 38, 38, 0.45);
        }
        /* Cytat patriotyczny pod kontenerem */
        .quote-strip {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            font-family: 'Cinzel', serif;
            font-size: 13px;
            color: rgba(255,255,255,0.75);
            letter-spacing: 1.5px;
            text-align: center;
            text-shadow: 0 1px 6px rgba(0,0,0,0.9);
            white-space: nowrap;
        }
    </style>
    <link rel="stylesheet" href="live-window-manager.css">
</head>
<body>
    <div class="container">
        <div class="anniversary-badge">&#9758; 1 SIERPNIA 1944 — 82. ROCZNICA &#9758;</div>
        <img src="worship_logo_bg.jpg" alt="Instrumental Worship" class="logo">
        <h1>INSTRUMENTAL WORSHIP</h1>
        <p id="track-name">Sanctuary Ambient &amp; Prayer</p>
        <div class="status-badge" id="status">NADAWANIE 24/7</div>
    </div>
    <div class="quote-strip">CZEŚĆ I CHWAŁA BOHATEROM POWSTANIA WARSZAWSKIEGO &nbsp;|&nbsp; DOBRZE, ŻE JESTEŚ</div>

    <audio id="stream-audio" autoplay></audio>
    <script type="text/javascript">
        (function() {
            const audio = document.getElementById("stream-audio");
            const trackNameEl = document.getElementById("track-name");
            let worshipPlaylist = [];
            let totalWorshipDuration = 0;
            
            async function initWorshipAudio() {
                try {
                    const res = await fetch('./worship_playlist.json');
                    if (res.ok) {
                        worshipPlaylist = await res.json();
                        totalWorshipDuration = worshipPlaylist.reduce((acc, t) => acc + (t.duration || 200), 0);
                        syncAndPlay();
                        audio.addEventListener('ended', syncAndPlay);
                    }
                } catch(e) {
                    console.error("Błąd ładowania playlisty worship:", e);
                }
            }
            
            function syncAndPlay() {
                if (!worshipPlaylist.length) return;
                const epochSeconds = Math.floor(Date.now() / 1000);
                let remaining = epochSeconds % (totalWorshipDuration || 770);
                let targetIndex = 0;
                let seekSeconds = 0;
                for (let i = 0; i < worshipPlaylist.length; i++) {
                    const dur = worshipPlaylist[i].duration || 200;
                    if (remaining < dur) {
                        targetIndex = i;
                        seekSeconds = remaining;
                        break;
                    }
                    remaining -= dur;
                }
                const currentTrack = worshipPlaylist[targetIndex];
                if (trackNameEl) trackNameEl.textContent = `${currentTrack.title} — ${currentTrack.artist}`;
                const cleanPath = currentTrack.url.replace('./', '');
                if (!audio.src.includes(cleanPath)) {
                    audio.src = currentTrack.url;
                    try { audio.currentTime = seekSeconds; } catch(e) {}
                }
                audio.play().catch(e => console.log("Auto-play wait for user gesture", e));
            }
            
            document.addEventListener("DOMContentLoaded", initWorshipAudio);
            document.addEventListener("click", () => {
                if (audio.paused) audio.play();
            }, { once: true });
        })();
    </script>
    <script src="live-window-manager.js"></script>
</body>
</html>
