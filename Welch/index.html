<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Gerald Welch | Christian Culture Network</title>
  <meta name="description" content="Oficjalna wizytówka artysty Geralda Welcha w Christian Culture Network. Wybierz wersję językową / Select language.">
  <link rel="canonical" href="https://polskieradio.cc/Welch/">
  <link rel="alternate" hreflang="pl" href="https://polskieradio.cc/Welch/pl/">
  <link rel="alternate" hreflang="en" href="https://polskieradio.cc/Welch/en/">
  <link rel="alternate" hreflang="x-default" href="https://polskieradio.cc/Welch/">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#05070c">

  <!-- JS Language Dispatcher with Respect for User Preference -->
  <script>
    (() => {
      try {
        const pref = localStorage.getItem('ekocc_locale') || localStorage.getItem('preferred_lang');
        if (pref === 'en') {
          location.replace('/Welch/en/');
          return;
        }
        if (pref === 'pl') {
          location.replace('/Welch/pl/');
          return;
        }
        const userLang = (navigator.languages && navigator.languages[0]) || navigator.language || '';
        if (/^en\b/i.test(userLang)) {
          location.replace('/Welch/en/');
          return;
        }
        location.replace('/Welch/pl/');
      } catch (e) {
        location.replace('/Welch/pl/');
      }
    })();
  </script>

  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background: #05070c;
      color: #F3E5C8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      box-sizing: border-box;
    }
    h1 {
      margin: 0 0 12px 0;
      color: #C4A35A;
      font-size: 2.2rem;
      letter-spacing: -0.01em;
    }
    p {
      margin: 0 0 32px 0;
      color: rgba(243, 229, 200, 0.75);
      max-width: 480px;
      line-height: 1.6;
    }
    .gw-router-links {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .gw-router-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      min-width: 140px;
      padding: 12px 28px;
      border-radius: 24px;
      border: 1px solid #C4A35A;
      background: rgba(196, 163, 90, 0.12);
      color: #F3E5C8;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .gw-router-btn:hover {
      background: #C4A35A;
      color: #05070c;
      transform: translateY(-2px);
    }
    .gw-router-btn.is-primary {
      background: #FF7A00;
      border-color: #FF7A00;
      color: #fff;
    }
    .gw-router-btn.is-primary:hover {
      background: #FF8C33;
      border-color: #FF8C33;
      color: #fff;
    }
  </style>
</head>
<body>
  <h1>Gerald Welch</h1>
  <p>Christian Culture Network Artist Showcase.<br>Wybierz wersję językową / Select your language:</p>
  <nav class="gw-router-links" aria-label="Wybór języka">
    <a href="/Welch/pl/" class="gw-router-btn is-primary">Polski (Wersja PL)</a>
    <a href="/Welch/en/" class="gw-router-btn">English (EN Version)</a>
  </nav>
</body>
</html>
