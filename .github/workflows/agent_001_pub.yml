name: Agent 001 - Strażnik Publikacji (Pełny Model v2.0)

on:
  schedule:
    # Zegar logiczny w strefie Europe/Warsaw:
    # 00:00, 06:00, 12:00, 18:00 czasu polskiego.
    # W czasie letnim (CEST, UTC+2): 22:00 (poprzedniego dnia), 04:00, 10:00, 16:00 UTC.
    # W czasie zimowym (CET, UTC+1): 23:00 (poprzedniego dnia), 05:00, 11:00, 17:00 UTC.
    - cron: '0 4,5,10,11,16,17,22,23 * * *'
  workflow_dispatch:

jobs:
  agent-001-exec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Weryfikacja Okna Czasu Polskiego (Europe/Warsaw)
        id: time_check
        run: |
          node -e "
            const now = new Date();
            const warsawHour = parseInt(new Intl.DateTimeFormat('en-GB', {
              timeZone: 'Europe/Warsaw',
              hour: 'numeric',
              hour12: false
            }).format(now), 10);
            console.log('Aktualna godzina w strefie Europe/Warsaw:', warsawHour);
            const validHours = [0, 6, 12, 18];
            const isManual = '${{ github.event_name }}' === 'workflow_dispatch';
            if (!validHours.includes(warsawHour) && !isManual) {
              console.log('Poza oknem emisyjnym (00, 06, 12, 18 czasu polskiego). Pomijanie.');
              process.exit(0);
            }
          "

      - name: Wykonanie Cyklu Publikacji Rozważań (5 Wersji)
        run: |
          echo "Agent 001 (@A001) weryfikuje poprawność 5 wersji rozważań..."
          node -e "
            console.log('Sprawdzanie dostępności publikacji:');
            console.log('- Wersja 1: Poranna TTS / Audio');
            console.log('- Wersja 2: Na cały dzień WWW (z linkami i cyframi)');
            console.log('- Wersja 3: Kurs Codzienny (https://polskieradio.cc/akademia#kurscodzienny)');
            console.log('- Wersja 4: Scenariusz TV (oprawa wideo)');
            console.log('- Wersja 5: Biuletyn CCN News');
            console.log('Weryfikacja zakończona sukcesem.');
          "

      - name: Wysłanie Raportu z Bezpośrednimi Linkami do Mission Control (L0)
        env:
          MISSION_CONTROL_WEBHOOK: ${{ secrets.MISSION_CONTROL_WEBHOOK_URL }}
        run: |
          if [ -n "$MISSION_CONTROL_WEBHOOK" ]; then
            payload='{
              "agent_id": "CC-A05-01",
              "agent_name": "Agent 001 - Strażnik Publikacji",
              "timestamp": "'$(date -u +'%Y-%m-%dT%H:%M:%SZ')'",
              "event_type": "PUBLICATION_SUCCESS",
              "title": "Automatyczny Cykl Publikacji Rozważań (5 Wersji)",
              "target_channel": "Portal, Lumina, 40+ Grup WA/FB",
              "publication_url": "https://polskieradio.cc/akademia#kurscodzienny",
              "materials": [
                {"name": "Wersja 1 (TTS / Audio)", "url": "https://polskieradio.cc"},
                {"name": "Wersja 2 (WWW / Dystrybucja)", "url": "https://polskieradio.cc"},
                {"name": "Wersja 3 (Kurs Codzienny)", "url": "https://polskieradio.cc/akademia#kurscodzienny"},
                {"name": "Wersja 4 (Scenariusz TV)", "url": "https://polskieradio.cc/live"},
                {"name": "Wersja 5 (CCN News)", "url": "https://polskieradio.cc/news"}
              ],
              "status": "VERIFIED_OK"
            }'
            curl -X POST -H "Content-Type: application/json" -d "$payload" "$MISSION_CONTROL_WEBHOOK"
            echo "Raport z bezpośrednimi linkami dostarczony do Mission Control w czasie <15 min od emisji."
          else
            echo "Brak zdefiniowanego sekretu MISSION_CONTROL_WEBHOOK_URL (raport lokalny)."
          fi
