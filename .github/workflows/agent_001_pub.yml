name: Agent 001 - Strażnik Publikacji (Pełny Model v2.0)

on:
  schedule:
    - cron: '0 0 * * *'   # Północ: Cykl materiałów cyklicznych / z datą ważności
    - cron: '0 6 * * *'   # 06:00 UTC: Poranny pakiet + Start kolportażu społecznościowego (40+ grup)
    - cron: '0 12 * * *'  # 12:00 UTC: Biuletyn CCN News i bieżący rezonans
    - cron: '0 18 * * *'  # 18:00 UTC: Premiera wideo / materiał publicystyczny
  workflow_dispatch:

jobs:
  agent-001-exec:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Wykonanie Cyklu Agenta 001 i Weryfikacja AI-SEO
        run: |
          echo "Agent 001 (@A001) analizuje harmonogram, źródła i reguły czasu..."
          node -e "
            const fs = require('fs');
            if (!fs.existsSync('skrzynka')) fs.mkdirSync('skrzynka', { recursive: true });
            const now = new Date().toISOString();
            const logEntry = '\n- [AGENT 001 - PUBLIKACJA v2.0] Cykl wykonany. Zastosowano zasady AI-SEO, ciszy nocnej oraz dawkowania społecznościowego (max 3 grupy/h). Czas: ' + now;
            fs.appendFileSync('skrzynka/TABLICA.md', logEntry);
          "

      - name: Zapis raportu w Skrzynce JOMA
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 [Agent 001] Automatyczna publikacja i synchronizacja v2.0 zakończona"
          branch: main

      - name: Wysłanie Raportu do Mission Control (L0)
        env:
          MISSION_CONTROL_WEBHOOK: ${{ secrets.MISSION_CONTROL_WEBHOOK_URL }}
        run: |
          if [ -n "$MISSION_CONTROL_WEBHOOK" ]; then
            payload='{
              "agent_id": "CC-A05-01",
              "agent_name": "Agent 001 - Strażnik Publikacji",
              "timestamp": "'$(date -u +'%Y-%m-%dT%H:%M:%SZ')'",
              "event_type": "PUBLICATION_SUCCESS",
              "title": "Automatyczny Cykl Publikacji i Dystrybucji",
              "target_channel": "Portal, Lumina, 40+ Grup WA/FB",
              "publication_url": "https://polskieradio.cc",
              "status": "VERIFIED_OK"
            }'
            curl -X POST -H "Content-Type: application/json" -d "$payload" "$MISSION_CONTROL_WEBHOOK"
            echo "Raport z linkiem dostarczony do Mission Control."
          else
            echo "Brak zdefiniowanego sekretu MISSION_CONTROL_WEBHOOK_URL (pomijam wysyłkę zewnętrzną)."
          fi
