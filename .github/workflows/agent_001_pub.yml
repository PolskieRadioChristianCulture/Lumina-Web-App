name: Agent 001 - Strażnik Publikacji (Pełny Model v2.0)

on:
  schedule:
    # Zegar logiczny w strefie Europe/Warsaw:
    # 00:00, 06:00, 12:00, 18:00 czasu polskiego.
    # W czasie letnim (CEST, UTC+2): 22:00 (poprzedniego dnia), 04:00, 10:00, 16:00 UTC.
    # W czasie zimowym (CET, UTC+1): 23:00 (poprzedniego dnia), 05:00, 11:00, 17:00 UTC.
    - cron: '0 4,5,10,11,16,17,22,23 * * *'
  workflow_dispatch:

jobs:
  agent-001-exec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Weryfikacja Okna Czasu Polskiego (Europe/Warsaw)
        id: time_check
        run: |
          node -e "
            const now = new Date();
            const warsawHour = parseInt(new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Warsaw', hour: 'numeric', hour12: false }).format(now), 10);
            console.log('Aktualna godzina w strefie Europe/Warsaw:', warsawHour);
            const isManual = '${{ github.event_name }}' === 'workflow_dispatch';
            const inWindow = isManual || [0, 6, 12, 18].includes(warsawHour);
            if (!inWindow) console.log('Poza oknem emisyjnym (00, 06, 12, 18 czasu polskiego). Pomijanie kolejnych kroków.');
            require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'in_window=' + inWindow + '\n');
          "

      # @A007 (JOMA-D038 Z7): workflow niczego nie publikuje — tylko SPRAWDZA produkcję i raportuje to, co faktycznie sprawdził.
      - name: Sprawdzenie produkcji (Akademia i lekcja dnia)
        id: verify
        if: steps.time_check.outputs.in_window == 'true'
        run: |
          DAY=$(TZ=Europe/Warsaw date +%-d)
          MONTH=$(TZ=Europe/Warsaw date +%-m)
          AKADEMIA=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://polskieradio.cc/akademia || echo 000)
          echo "Akademia: HTTP $AKADEMIA"
          LESSON_URL=""
          LESSON=n/a
          # Kurs „Z Biblią za pan brat” (październik): Dzień N = N października
          if [ "$MONTH" = "10" ]; then
            LESSON_URL="https://polskieradio.cc/akademia/kurscodzienny/dzien-$DAY"
            LESSON=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$LESSON_URL" || echo 000)
            echo "Lekcja dnia $DAY: HTTP $LESSON ($LESSON_URL)"
          fi
          if [ "$AKADEMIA" = "200" ] && { [ "$LESSON" = "200" ] || [ "$LESSON" = "n/a" ]; }; then OK=true; else OK=false; fi
          echo "page_ok=$OK" >> "$GITHUB_OUTPUT"
          echo "lesson_url=$LESSON_URL" >> "$GITHUB_OUTPUT"
          echo "detail=akademia=$AKADEMIA lekcja_dnia_$DAY=$LESSON" >> "$GITHUB_OUTPUT"
          echo "Wynik sprawdzenia: page_ok=$OK (sprawdza dostępność stron, nie treść 5 wersji)"

      - name: Wysłanie Raportu do Mission Control (L0)
        if: steps.time_check.outputs.in_window == 'true'
        env:
          MISSION_CONTROL_WEBHOOK: ${{ secrets.MISSION_CONTROL_WEBHOOK_URL }}
          PAGE_OK: ${{ steps.verify.outputs.page_ok }}
          LESSON_URL: ${{ steps.verify.outputs.lesson_url }}
          DETAIL: ${{ steps.verify.outputs.detail }}
        run: |
          if [ "$PAGE_OK" = "true" ]; then EVENT=PAGE_REACHABLE; STATUS=REACHABLE_CONTENT_NOT_VERIFIED; else EVENT=HEARTBEAT; STATUS=NOT_VERIFIED; fi
          echo "Raport: $EVENT / $STATUS ($DETAIL)"
          if [ -n "$MISSION_CONTROL_WEBHOOK" ]; then
            payload=$(jq -n --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg ev "$EVENT" --arg st "$STATUS" --arg det "$DETAIL" --arg lesson "$LESSON_URL" '{
              agent_id: "CC-A05-01",
              agent_name: "Agent 001 - Strażnik Publikacji",
              timestamp: $ts,
              event_type: $ev,
              title: "Sprawdzenie dostępności Akademii i lekcji dnia (workflow nie publikuje)",
              publication_url: "https://polskieradio.cc/akademia",
              lesson_url: $lesson,
              detail: $det,
              status: $st
            }')
            curl -sS -X POST -H "Content-Type: application/json" -d "$payload" "$MISSION_CONTROL_WEBHOOK"
          else
            echo "Brak zdefiniowanego sekretu MISSION_CONTROL_WEBHOOK_URL (raport lokalny)."
          fi
