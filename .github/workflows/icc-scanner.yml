name: ICC Scanner (scheduled)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: icc-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Run Guardian (non-fatal)
        id: guardian
        run: |
          if [ -f scripts/straznik-kodu-check.js ]; then
            node scripts/straznik-kodu-check.js > guardian.out 2>&1 || true
          else
            echo "no_guardian" > guardian.out
          fi
          head -c 3000 guardian.out > guardian.trim || true

      - name: Check public endpoints
        id: health
        continue-on-error: true
        env:
          HEALTHCHECK_URLS: ${{ vars.ICC_HEALTHCHECK_URLS }}
        run: |
          node scripts/public-health-check.cjs > health.out
          head -c 3000 health.out > health.trim || true

      - name: Run ICC scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          node scripts/icc_scan.cjs

      - name: Fail on public endpoint outage
        if: steps.health.outcome == 'failure'
        run: |
          echo "::error::One or more monitored public endpoints failed."
          exit 1
