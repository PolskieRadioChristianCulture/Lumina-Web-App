    <style>
      /* FLOATING BACK TO TOP BUTTON */
      .back-to-top {
          position: fixed;
          right: 1.5rem;
          bottom: 2rem;
          width: 40px;
          height: 40px;
          border-radius: 9999px;
          background: #bb142e;
          color: #ffffff;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 0.95rem;
          box-shadow: 0 4px 14px rgba(187, 20, 46, 0.4);
          opacity: 0;
          visibility: hidden;
          transform: translateY(12px);
          transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
          z-index: 999;
          cursor: pointer;
          border: 1px solid rgba(255, 255, 255, 0.2);
          text-decoration: none;
      }

      .back-to-top.visible {
          opacity: 1;
          visibility: visible;
          transform: translateY(0);
      }

      .back-to-top:hover {
          background: #900f23;
          transform: translateY(-3px);
          box-shadow: 0 8px 20px rgba(187, 20, 46, 0.5);
      }

      .back-to-top:active {
          transform: translateY(0) scale(0.95);
      }

      @media (max-width: 767px) {
          .back-to-top {
              right: 1.25rem;
              bottom: max(1.25rem, env(safe-area-inset-bottom, 20px));
              width: 44px;
              height: 44px;
              font-size: 1.05rem;
          }
      }

      /* Estetyczny scrollbar spójny z systemem CC */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0a0a;
        border-left: 1px solid #1a1a1a;
      }
      ::-webkit-scrollbar-thumb {
        background: #2a2a2a;
        border-radius: 5px;
        border: 2px solid #0a0a0a;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #bb142e;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: #2a2a2a #0a0a0a;
      }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-900 antialiased selection:bg-[#bb142e] selection:text-white">
    <div id="root"></div>

    <!-- Back to top button -->
    <a href="#top" id="backToTop" class="back-to-top" aria-label="Przewiń do góry">
        <i class="fa-solid fa-chevron-up"></i>
    </a>

    <script>
      (function() {
        const btn = document.getElementById('backToTop');
        if (!btn) return;
        window.addEventListener('scroll', function() {
            if (window.scrollY > 400) {
                btn.classList.add('visible');
            } else {
                btn.classList.remove('visible');
            }
        }, { passive: true });
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      })();
    </script>
  </body>
