<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pilot Smart TV • Christian Culture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
  <style>
    :root {
      --silver-border: rgba(226, 232, 240, 0.25);
      --gold-accent: #d4af37;
      --cyan: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      background: radial-gradient(circle at 50% 0%, #0f172a 0%, #030508 60%, #000 100%);
      color: #f8fafc;
      font-family: "Outfit", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
      padding-bottom: 24px;
    }
    .remote-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(18,24,38,0.8);
      backdrop-filter: blur(20px);
      border: 1px solid var(--silver-border);
      padding: 10px 14px;
      border-radius: 16px;
    }
    .brand-title { font-family: "Cinzel", serif; font-size: 1rem; font-weight: 800; color: #e2e8f0; }
    .pair-badge {
      font-size: 0.72rem; font-weight: 700; padding: 4px 12px;
      border-radius: 20px; display: flex; align-items: center; gap: 6px; transition: all 0.3s;
    }
    .connecting { color: #f59e0b; background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.4); }
    .connected  { color: #22c55e; background: rgba(34,197,94,0.15);  border: 1px solid rgba(34,197,94,0.4); }
    .sent       { color: #38bdf8; background: rgba(56,189,248,0.15); border: 1px solid rgba(56,189,248,0.4); }
    .err        { color: #ef4444; background: rgba(239,68,68,0.15);  border: 1px solid rgba(239,68,68,0.4); }
    /* D-PAD */
    .dpad-section { display: flex; flex-direction: column; align-items: center; }
    .dpad-cross {
      width: 210px; height: 210px; position: relative;
      background: rgba(15,23,42,0.9); border: 2px solid var(--silver-border); border-radius: 50%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 2px 4px rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
    }
    .dpad-btn {
      position: absolute; background: #1e293b; border: 1px solid var(--silver-border);
      color: #fff; font-size: 1.2rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all 0.12s;
      min-width: 44px; min-height: 44px;
    }
    .dpad-btn:active { background: var(--cyan); color: #000; transform: scale(0.88); }
    .dpad-up    { top: 8px;    left: 50%; transform: translateX(-50%); width: 60px; height: 52px; border-radius: 12px; }
    .dpad-down  { bottom: 8px; left: 50%; transform: translateX(-50%); width: 60px; height: 52px; border-radius: 12px; }
    .dpad-left  { left: 8px;   top: 50%;  transform: translateY(-50%); width: 52px; height: 60px; border-radius: 12px; }
    .dpad-right { right: 8px;  top: 50%;  transform: translateY(-50%); width: 52px; height: 60px; border-radius: 12px; }
    .dpad-ok {
      width: 72px; height: 72px; border-radius: 50%;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 40%, #94a3b8 100%);
      color: #000; font-weight: 900; font-size: 1rem; border: none;
      box-shadow: 0 0 18px rgba(255,255,255,0.4), 0 4px 12px rgba(0,0,0,0.6); cursor: pointer;
    }
    .dpad-ok:active { transform: scale(0.88); }
    /* Media Bar */
    .media-bar {
      display: flex; gap: 6px;
      background: rgba(18,24,38,0.8); border: 1px solid var(--silver-border);
      padding: 8px; border-radius: 16px;
    }
    .btn-media {
      flex: 1; background: #1e293b; border: 1px solid var(--silver-border); color: #fff;
      padding: 12px 4px; border-radius: 12px; font-size: 1.05rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; min-height: 48px;
    }
    .btn-media:active { background: #334155; transform: scale(0.92); }
    /* Channel Grid */
    .section-label {
      font-size: 0.78rem; font-weight: 700; color: #94a3b8;
      text-transform: uppercase; letter-spacing: 1px; text-align: center;
    }
    .channels-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .btn-channel {
      background: rgba(15,23,42,0.9); border: 1.5px solid var(--silver-border); color: #fff;
      padding: 10px 6px; border-radius: 14px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      cursor: pointer; position: relative; min-height: 72px;
    }
    .btn-channel:active { background: rgba(255,255,255,0.12); border-color: #fff; transform: scale(0.93); }
    .ch-logo { width: 30px; height: 30px; border-radius: 8px; object-fit: cover; border: 1px solid var(--silver-border); }
    .ch-num { font-size: 0.62rem; font-weight: 900; color: var(--gold-accent); position: absolute; top: 4px; right: 6px; }
    .ch-name { font-size: 0.7rem; font-weight: 700; text-align: center; line-height: 1.2; color: #e2e8f0; }
    .tv-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-tv {
      background: rgba(15,23,42,0.9); border: 1.5px solid var(--silver-border); color: #fff;
      padding: 12px; border-radius: 14px; display: flex; align-items: center;
      justify-content: center; gap: 8px; font-size: 0.85rem; font-weight: 700; cursor: pointer; min-height: 48px;
    }
    .btn-tv:active { background: rgba(255,255,255,0.1); transform: scale(0.93); }
    .patronite-banner {
      background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(0,0,0,0.6));
      border: 1px solid rgba(212,175,55,0.4);
      padding: 12px 14px; border-radius: 14px;
      display: flex; align-items: center; justify-content: space-between;
      text-decoration: none; color: #fff;
    }
    .patronite-btn { background: #d4af37; color: #000; font-size: 0.75rem; font-weight: 800; padding: 6px 14px; border-radius: 20px; white-space: nowrap; }
    /* Dynamic State Sync Styles */
    .tv-status-card {
      background: rgba(18,24,38,0.85);
      border: 1px solid var(--silver-border);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .tv-now-info { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
    .tv-now-station { font-size: 0.82rem; font-weight: 800; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tv-now-title { font-size: 0.72rem; color: var(--gold-accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tv-status-badge {
      font-size: 0.65rem; font-weight: 800; color: #22c55e;
      background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.4);
      padding: 4px 9px; border-radius: 20px; display: flex; align-items: center; gap: 5px; flex-shrink: 0;
    }
    .btn-channel.active-channel, .btn-tv.active-channel {
      border-color: var(--gold-accent) !important;
      background: linear-gradient(135deg, rgba(212,175,55,0.22) 0%, rgba(15,23,42,0.95) 100%) !important;
      box-shadow: 0 0 16px rgba(212,175,55,0.45);
      transform: scale(1.02);
    }
    .active-badge {
      position: absolute; bottom: 3px; font-size: 0.52rem; font-weight: 800;
      color: var(--gold-accent); background: rgba(0,0,0,0.75);
      padding: 1px 5px; border-radius: 10px; border: 1px solid rgba(212,175,55,0.5);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="remote-header">
    <div>
      <div class="brand-title">PILOT SMART TV</div>
      <div style="font-size:0.7rem; color:#94a3b8; margin-top:2px;">Christian Culture &bull; PolskieRadio.cc/tv</div>
    </div>
    <div class="pair-badge connecting" id="pairStatus">
      <i class="fa-solid fa-spinner fa-spin"></i> Łączenie...
    </div>
  </div>

  <!-- Realtime Smart TV Status Bar -->
  <div class="tv-status-card" id="tvStatusCard">
    <div class="tv-now-info">
      <div class="tv-now-station" id="tvNowStation">Oczekiwanie na Smart TV...</div>
      <div class="tv-now-title" id="tvNowTitle">Sesja: <span id="tvSessionName" style="color:var(--gold-accent); font-weight:800;">---</span></div>
    </div>
    <div class="tv-status-badge" id="tvLiveBadge">
      <i class="fa-solid fa-satellite-dish"></i> SYNC
    </div>
  </div>

  <div class="dpad-section">
    <div class="dpad-cross">
      <button class="dpad-btn dpad-up"    onclick="sendCmd('up')"><i class="fa-solid fa-chevron-up"></i></button>
      <button class="dpad-btn dpad-down"  onclick="sendCmd('down')"><i class="fa-solid fa-chevron-down"></i></button>
      <button class="dpad-btn dpad-left"  onclick="sendCmd('left')"><i class="fa-solid fa-chevron-left"></i></button>
      <button class="dpad-btn dpad-right" onclick="sendCmd('right')"><i class="fa-solid fa-chevron-right"></i></button>
      <button class="dpad-ok" onclick="sendCmd('ok')">OK</button>
    </div>
  </div>

  <div class="media-bar">
    <button class="btn-media" onclick="sendCmd('vol_down')"><i class="fa-solid fa-volume-low"></i></button>
    <button class="btn-media" onclick="sendCmd('play_pause')"><i class="fa-solid fa-play"></i>&nbsp;/&nbsp;<i class="fa-solid fa-pause"></i></button>
    <button class="btn-media" onclick="sendCmd('vol_up')"><i class="fa-solid fa-volume-high"></i></button>
    <button class="btn-media" onclick="sendCmd('fullscreen')"><i class="fa-solid fa-expand"></i></button>
  </div>

  <div class="section-label">6 Stacji Radiowych</div>
  <div class="channels-grid">
    <button class="btn-channel" data-ch="1" onclick="sendChannel(1)"><span class="ch-num">1</span><img src="logo-radio-cc.png" class="ch-logo" onerror="this.remove()"><span class="ch-name">Radio CC (PL)</span></button>
    <button class="btn-channel" data-ch="2" onclick="sendChannel(2)"><span class="ch-num">2</span><img src="logo-worship.jpg" class="ch-logo" onerror="this.remove()"><span class="ch-name">Worship Music</span></button>
    <button class="btn-channel" data-ch="3" onclick="sendChannel(3)"><span class="ch-num">3</span><img src="logo-biblia-audio.jpg" class="ch-logo" onerror="this.remove()"><span class="ch-name">Radio Biblia</span></button>
    <button class="btn-channel" data-ch="4" onclick="sendChannel(4)"><span class="ch-num">4</span><img src="logo-radio-global.webp" class="ch-logo" onerror="this.remove()"><span class="ch-name">Radio Global</span></button>
    <button class="btn-channel" data-ch="5" onclick="sendChannel(5)"><span class="ch-num">5</span><img src="logo-globalna-biblia.jpg" class="ch-logo" onerror="this.remove()"><span class="ch-name">Global Bible</span></button>
    <button class="btn-channel" data-ch="6" onclick="sendChannel(6)"><span class="ch-num">6</span><img src="logo-biblia-spiewana.jpg" class="ch-logo" onerror="this.remove()"><span class="ch-name">Biblia Spiewa.</span></button>
  </div>

  <div class="section-label">Telewizja i Kino</div>
  <div class="tv-row">
    <button class="btn-tv" data-ch="7" onclick="sendChannel(7)"><i class="fa-solid fa-tv"></i> CCTV24 TV</button>
    <button class="btn-tv" data-ch="8" onclick="sendChannel(8)"><i class="fa-solid fa-film"></i> Kino VOD</button>
  </div>

  <a href="https://patronite.pl/osobowoscplus" target="_blank" class="patronite-banner">
    <div>
      <div style="font-size:0.85rem; font-weight:800; color:#d4af37;"><i class="fa-solid fa-heart"></i> Wesprzyj Misje CC</div>
      <div style="font-size:0.7rem; color:#cbd5e1; margin-top:2px;">Patronite - Osobowosc Plus</div>
    </div>
    <div class="patronite-btn">Wspieram</div>
  </a>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getDatabase, ref, set, onValue } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

    const firebaseConfig = {
      apiKey: "AIzaSyAkX7XDMWjeUPeaIk0WdvoY4d9VhIPyD7M",
      authDomain: "lumina-cc.firebaseapp.com",
      databaseURL: "https://lumina-cc-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "lumina-cc",
      storageBucket: "lumina-cc.firebasestorage.app",
      messagingSenderId: "413985877183",
      appId: "1:413985877183:web:b0c99a686a4fb1b875aa0a"
    };

    const app = initializeApp(firebaseConfig, 'pilot-' + Math.random());
    const auth = getAuth(app);
    const rtdb = getDatabase(app);
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('session') || 'public';
    const tvRef = ref(rtdb, 'tv_remote/' + sessionId);
    const stateRef = ref(rtdb, 'tv_state/' + sessionId);
    const statusEl = document.getElementById('pairStatus');
    const sessionNameEl = document.getElementById('tvSessionName');
    if (sessionNameEl) sessionNameEl.textContent = sessionId;

    signInAnonymously(auth).then(() => {
      console.log('[Pilot] Firebase Auth Anonymous OK');
      initListeners();
    }).catch(err => {
      console.error('[Pilot] Auth Error, falling back to direct listeners:', err);
      initListeners();
    });

    function initListeners() {
      // 1. Status połączenia RTDB
      onValue(ref(rtdb, '.info/connected'), (snap) => {
        if (snap.val() === true) {
          statusEl.className = 'pair-badge connected';
          statusEl.innerHTML = '<i class="fa-solid fa-circle" style="font-size:0.55rem;"></i> POŁĄCZONO';
        } else {
          statusEl.className = 'pair-badge connecting';
          statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Łączenie...';
        }
      });

      // 2. Dwukierunkowa synchronizacja stanu ze Smart TV (Realtime Feedback)
      onValue(stateRef, (snap) => {
        const state = snap.val();
        if (!state) return;
        updateTvStateUI(state);
      });
    }

    function updateTvStateUI(state) {
      const stationEl = document.getElementById('tvNowStation');
      const titleEl = document.getElementById('tvNowTitle');
      const liveBadge = document.getElementById('tvLiveBadge');

      if (stationEl && state.channelName) {
        stationEl.textContent = state.channelName;
      }
      if (titleEl && state.title) {
        titleEl.textContent = state.title;
      }
      if (liveBadge) {
        liveBadge.innerHTML = state.isPlaying
          ? '<i class="fa-solid fa-circle-play" style="color:#22c55e;"></i> GRA'
          : '<i class="fa-solid fa-circle-pause" style="color:#f59e0b;"></i> PAUZA';
      }

      // Podświetlenie aktywnego kanału na pilocie
      const activeNum = Number(state.channel);
      document.querySelectorAll('.btn-channel, .btn-tv').forEach(btn => {
        btn.classList.remove('active-channel');
        const badge = btn.querySelector('.active-badge');
        if (badge) badge.remove();
      });

      const activeBtn = document.querySelector(`[data-ch="${activeNum}"]`);
      if (activeBtn) {
        activeBtn.classList.add('active-channel');
        const b = document.createElement('span');
        b.className = 'active-badge';
        b.textContent = 'NA ŻYWO';
        activeBtn.appendChild(b);
      }
    }

    function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){} }

    function flash() {
      statusEl.className = 'pair-badge sent';
      statusEl.innerHTML = '<i class="fa-solid fa-paper-plane"></i> WYSŁANO';
      setTimeout(() => {
        statusEl.className = 'pair-badge connected';
        statusEl.innerHTML = '<i class="fa-solid fa-circle" style="font-size:0.55rem;"></i> POŁĄCZONO';
      }, 700);
    }

    window.sendCmd = function(action) {
      vibrate(30);
      set(tvRef, { type: 'CMD', action, ts: Date.now() }).then(flash).catch(e => {
        console.warn('sendCmd error:', e);
        statusEl.className = 'pair-badge err';
        statusEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> BŁĄD SIECI';
      });
    };

    window.sendChannel = function(num) {
      vibrate(40);
      set(tvRef, { type: 'CHANNEL', channel: num, ts: Date.now() }).then(flash).catch(e => {
        console.warn('sendChannel error:', e);
        statusEl.className = 'pair-badge err';
        statusEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> BŁĄD SIECI';
      });
    };
  </script>
</body>
</html>
