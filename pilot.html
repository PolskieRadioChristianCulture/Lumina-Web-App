<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pilot Smart TV • Christian Culture</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">

  <style>
    :root {
      --bg-black: #05070c;
      --silver-main: #cbd5e1;
      --silver-border: rgba(226, 232, 240, 0.25);
      --silver-metallic: linear-gradient(135deg, #ffffff 0%, #cbd5e1 30%, #94a3b8 60%, #e2e8f0 100%);
      --gold-accent: #d4af37;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at 50% 0%, #0f172a 0%, #030508 60%, #000000 100%);
      color: #f8fafc;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }

    .remote-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(18, 24, 38, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid var(--silver-border);
      padding: 12px 16px;
      border-radius: 16px;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      font-weight: 800;
      background: var(--silver-metallic);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .pair-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: #22c55e;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* D-PAD */
    .dpad-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 20px 0;
    }

    .dpad-cross {
      width: 220px;
      height: 220px;
      position: relative;
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid var(--silver-border);
      border-radius: 50%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 2px 4px rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dpad-btn {
      position: absolute;
      background: #1e293b;
      border: 1px solid var(--silver-border);
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .dpad-btn:active {
      background: #38bdf8;
      color: #000;
      transform: scale(0.92);
    }

    .dpad-up { top: 10px; left: 50%; transform: translateX(-50%); width: 60px; height: 50px; border-radius: 12px; }
    .dpad-down { bottom: 10px; left: 50%; transform: translateX(-50%); width: 60px; height: 50px; border-radius: 12px; }
    .dpad-left { left: 10px; top: 50%; transform: translateY(-50%); width: 50px; height: 60px; border-radius: 12px; }
    .dpad-right { right: 10px; top: 50%; transform: translateY(-50%); width: 50px; height: 60px; border-radius: 12px; }

    .dpad-ok {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: var(--silver-metallic);
      color: #000;
      font-weight: 800;
      font-size: 1.1rem;
      border: none;
      box-shadow: 0 0 15px rgba(255,255,255,0.4);
      cursor: pointer;
    }
    .dpad-ok:active { transform: scale(0.9); }

    /* Media Controls */
    .media-bar {
      display: flex;
      justify-content: space-around;
      background: rgba(18, 24, 38, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid var(--silver-border);
      padding: 12px;
      border-radius: 16px;
      margin-bottom: 16px;
    }

    .btn-media {
      background: #1e293b;
      border: 1px solid var(--silver-border);
      color: #fff;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .btn-media:active { background: #64748b; }

    /* Quick Channels Grid */
    .channels-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--silver-main);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      text-align: center;
    }

    .channels-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .btn-channel {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--silver-border);
      color: #fff;
      padding: 12px 6px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-channel:active {
      background: var(--silver-metallic);
      color: #000;
      transform: scale(0.95);
    }

    .ch-num {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--gold-accent);
    }
    .btn-channel:active .ch-num { color: #000; }

    .ch-name {
      font-size: 0.78rem;
      font-weight: 700;
      text-align: center;
    }

    /* Patronite Promo Banner */
    .patronite-banner {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(124, 58, 237, 0.15));
      border: 1px solid rgba(212, 175, 55, 0.4);
      padding: 12px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      text-decoration: none;
      color: #fff;
    }
    .patronite-btn {
      background: #d4af37;
      color: #000;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="remote-header">
    <div>
      <div class="brand-title">PILOT SMART TV</div>
      <div style="font-size:0.72rem; color:#94a3b8;">Christian Culture • PolskieRadio.cc</div>
    </div>
    <div class="pair-badge" id="pairStatus">
      <i class="fa-solid fa-link"></i> POŁĄCZONO
    </div>
  </div>

  <!-- D-PAD Navigation -->
  <div class="dpad-section">
    <div class="dpad-cross">
      <button class="dpad-btn dpad-up" onclick="sendCmd('up')"><i class="fa-solid fa-chevron-up"></i></button>
      <button class="dpad-btn dpad-down" onclick="sendCmd('down')"><i class="fa-solid fa-chevron-down"></i></button>
      <button class="dpad-btn dpad-left" onclick="sendCmd('left')"><i class="fa-solid fa-chevron-left"></i></button>
      <button class="dpad-btn dpad-right" onclick="sendCmd('right')"><i class="fa-solid fa-chevron-right"></i></button>
      <button class="dpad-ok" onclick="sendCmd('ok')">OK</button>
    </div>
  </div>

  <!-- Media Controls -->
  <div class="media-bar">
    <button class="btn-media" onclick="sendCmd('vol_down')"><i class="fa-solid fa-volume-low"></i></button>
    <button class="btn-media" onclick="sendCmd('play_pause')"><i class="fa-solid fa-play"></i> / <i class="fa-solid fa-pause"></i></button>
    <button class="btn-media" onclick="sendCmd('vol_up')"><i class="fa-solid fa-volume-high"></i></button>
    <button class="btn-media" onclick="sendCmd('fullscreen')"><i class="fa-solid fa-expand"></i></button>
  </div>

  <!-- Quick Stations & TV Channels Grid -->
  <div>
    <div class="channels-title">Wybór Stacji i Kanałów TV</div>
    <div class="channels-grid">
      <button class="btn-channel" onclick="sendChannel(1)">
        <span class="ch-num">1</span>
        <i class="fa-solid fa-radio"></i>
        <span class="ch-name">Radio CC</span>
      </button>

      <button class="btn-channel" onclick="sendChannel(2)">
        <span class="ch-num">2</span>
        <i class="fa-solid fa-dove"></i>
        <span class="ch-name">Worship</span>
      </button>

      <button class="btn-channel" onclick="sendChannel(3)">
        <span class="ch-num">3</span>
        <i class="fa-solid fa-book-bible"></i>
        <span class="ch-name">Biblia Audio</span>
      </button>

      <button class="btn-channel" onclick="sendChannel(4)">
        <span class="ch-num">4</span>
        <i class="fa-solid fa-globe"></i>
        <span class="ch-name">Radio Global</span>
      </button>

      <button class="btn-channel" onclick="sendChannel(5)">
        <span class="ch-num">5</span>
        <i class="fa-solid fa-music"></i>
        <span class="ch-name">Biblia Śpiew.</span>
      </button>

      <button class="btn-channel" onclick="sendChannel(6)">
        <span class="ch-num">6</span>
        <i class="fa-solid fa-tv"></i>
        <span class="ch-name">CCTV24 TV</span>
      </button>
    </div>
  </div>

  <!-- Patronite Mission Support Banner -->
  <a href="https://patronite.pl/osobowoscplus" target="_blank" class="patronite-banner">
    <div>
      <div style="font-size:0.85rem; font-weight:800; color:#d4af37;"><i class="fa-solid fa-heart"></i> Wesprzyj Misję</div>
      <div style="font-size:0.72rem; color:#cbd5e1;">Patronite • Osobowość Plus</div>
    </div>
    <div class="patronite-btn">Wspieram ➔</div>
  </a>

  <script>
    const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('cc_smart_tv_sync') : null;

    function sendCmd(action) {
      if (navigator.vibrate) navigator.vibrate(30);
      const payload = { type: 'CMD', action: action, ts: Date.now() };
      if (bc) bc.postMessage(payload);
      localStorage.setItem('cc_smart_tv_cmd', JSON.stringify(payload));
    }

    function sendChannel(num) {
      if (navigator.vibrate) navigator.vibrate(40);
      const payload = { type: 'CHANNEL', channel: num, ts: Date.now() };
      if (bc) bc.postMessage(payload);
      localStorage.setItem('cc_smart_tv_cmd', JSON.stringify(payload));
    }
  </script>
</body>
</html>
