<!DOCTYPE html>
<html lang="pl">
<head>
    <!-- Google Analytics -->
    <script async src="https:// ── Universal Smooth Scroll to Top Logic ──
        window.scrollToTopPage = function() {
            try {
                window.scrollTo({ top: 0, behavior: 'smooth' });
                document.documentElement.scrollTo({ top: 0, behavior: 'smooth' });
                document.body.scrollTo({ top: 0, behavior: 'smooth' });
            } catch(e) {
                window.scrollTo(0, 0);
            }
        };

        function checkScrollPositionUniversal() {
            const btn = document.getElementById('btnScrollToTop');
            if (!btn) return;
            const scrolled = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
            if (scrolled > 160) {
                btn.classList.add('visible');
            } else {
                btn.classList.remove('visible');
            }
        }

        window.addEventListener('scroll', checkScrollPositionUniversal, { passive: true });
        document.addEventListener('scroll', checkScrollPositionUniversal, { passive: true });
        window.addEventListener('resize', checkScrollPositionUniversal, { passive: true });

        window.addEventListener('DOMContentLoaded', () => {
            // ── ADMIN MODE DETECTION ────────────────────────────────────────
            // Panel "Występujesz jako" is ONLY visible for the founder.
            // Activate via: ?admin=1 in URL (stores in localStorage).
            // Clear via: ?admin=0 or removing localStorage key.
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('admin') === '1') {
                localStorage.setItem('lumina_admin', '1');
                // Clean URL without reload
                const cleanUrl = window.location.pathname + window.location.hash;
                window.history.replaceState({}, '', cleanUrl);
            } else if (urlParams.get('admin') === '0') {
                localStorage.removeItem('lumina_admin');
                const cleanUrl = window.location.pathname + window.location.hash;
                window.history.replaceState({}, '', cleanUrl);
            }
            const isAdmin = localStorage.getItem('lumina_admin') === '1';
            const founderHub = document.getElementById('founderMissionHub');
            if (isAdmin && founderHub) {
                founderHub.classList.add('admin-active');
            }
            // ────────────────────────────────────────────────────────────────

            syncFounderAvatar();
            renderFeed();

            // Realtime Sync from LuminaDB (Firestore)
            const initRealtimeSync = () => {
                if (window.LuminaDB) {
                    // 1. Subscribe to Live Feed Posts
                    window.LuminaDB.subscribeToFeedPosts((cloudPosts) => {
                        window.cloudFeedPosts = cloudPosts;
                        renderFeed();
                    });

                    // 2. Subscribe to Cezary & Wioletta Profile Avatars
                    window.LuminaDB.subscribeToProfile('cezaryrgowski', (p) => {
                        if (p && p.avatar && document.getElementById('founderBarAvatar')) {
                            document.getElementById('founderBarAvatar').src = p.avatar;
                        }
                        renderFeed();
                    });
                    window.LuminaDB.subscribeToProfile('wiolettarogowska', () => {
                        renderFeed();
                    });
                } else {
                    setTimeout(initRealtimeSync, 300);
                }
            };
            initRealtimeSync();
        });
        window.addEventListener('storage', () => {
            syncFounderAvatar();
            renderFeed();
        });
    </script>
</body>
</html>
